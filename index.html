<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>경영전략 중간고사 모의고사</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: OMR 답안지처럼 세트 탭 + 문항 카드 한 줄 목록, 상단 고정 점수판 */
:root{
  --bg:#f3f5f8; --paper:#ffffff; --ink:#1c2a3f; --muted:#5c6b80; --line:#d6dde7;
  --accent:#23447a; --mark:#c8322b; --ok:#1f7a4d; --okbg:#e6f4ec; --nobg:#fbe9e7; --tag:#e7edf6;
  --display:"Gowun Batang",serif; --body:"Noto Sans KR",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121821; --paper:#1a2230; --ink:#e3e9f2; --muted:#9aa8bb; --line:#2c3748;
  --accent:#8fb0e8; --mark:#f07b72; --ok:#6fd19c; --okbg:#173426; --nobg:#3a1d1b; --tag:#243145; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121821; --paper:#1a2230; --ink:#e3e9f2; --muted:#9aa8bb; --line:#2c3748;
  --accent:#8fb0e8; --mark:#f07b72; --ok:#6fd19c; --okbg:#173426; --nobg:#3a1d1b; --tag:#243145; color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.6}
.wrap{max-width:820px;margin:0 auto;padding-block:28px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
h1{font-family:var(--display);font-size:1.9rem;margin:0;text-wrap:balance}
.sub{color:var(--muted);margin:0;font-size:.92rem}
.info{display:flex;flex-wrap:wrap;gap:8px}
.info span{background:var(--tag);border-radius:4px;padding:3px 9px;font-size:.82rem;color:var(--muted)}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:10px;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{font:inherit;border:1px solid var(--line);background:var(--paper);color:var(--ink);padding:6px 14px;border-radius:999px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--paper);font-weight:700}
.score{font-variant-numeric:tabular-nums;font-size:.9rem;color:var(--muted);display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.score b{color:var(--mark);font-size:1.1rem}
.wbtn{font:inherit;font-size:.82rem;border:1px solid var(--mark);background:var(--paper);color:var(--mark);border-radius:999px;padding:4px 12px;cursor:pointer}
.wbtn[aria-pressed="true"]{background:var(--mark);color:var(--paper)}
.wbtn:disabled{opacity:.45;cursor:default}
.wbtn:focus-visible,.reset:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wc{font-size:.75em;color:var(--mark);font-weight:700;font-variant-numeric:tabular-nums}
.tabs button[aria-selected="true"] .wc{color:var(--paper)}
.wbanner{background:var(--nobg);border-left:3px solid var(--mark);padding:8px 12px;border-radius:4px;font-size:.88rem}
.reset{font:inherit;font-size:.82rem;border:none;background:none;color:var(--accent);cursor:pointer;text-decoration:underline}
.section{font-family:var(--display);font-size:1.15rem;margin:10px 0 0;color:var(--accent)}
.q{background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:16px 18px;display:flex;flex-direction:column;gap:10px;min-width:0}
.qh{display:flex;gap:10px;align-items:baseline}
.num{font-family:var(--display);font-weight:700;color:var(--accent);min-width:2.2em;font-variant-numeric:tabular-nums}
.qt{flex:1;min-width:0}
.meta{font-size:.75rem;color:var(--muted);white-space:nowrap}
.chip{align-self:flex-start;font-size:.75rem;font-weight:700;padding:2px 9px;border-radius:999px;background:var(--cbg);color:var(--cfg);line-height:1.5}
.ch1{--cbg:#e3ecfb;--cfg:#1f4a8f}.ch2{--cbg:#efe7f8;--cfg:#5b3a8c}.ch3{--cbg:#e1f3ea;--cfg:#1d6b44}.ch4{--cbg:#fbeedd;--cfg:#8a5212}.ch5{--cbg:#fbe4e6;--cfg:#9a2a35}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .ch1{--cbg:#1d2c46;--cfg:#a9c4f2}:root:not([data-theme="light"]) .ch2{--cbg:#2c2240;--cfg:#cdb4ef}:root:not([data-theme="light"]) .ch3{--cbg:#17352a;--cfg:#8fdcb3}:root:not([data-theme="light"]) .ch4{--cbg:#3a2a14;--cfg:#f0c58a}:root:not([data-theme="light"]) .ch5{--cbg:#3d1c21;--cfg:#f2a6ae}}
:root[data-theme="dark"] .ch1{--cbg:#1d2c46;--cfg:#a9c4f2}:root[data-theme="dark"] .ch2{--cbg:#2c2240;--cfg:#cdb4ef}:root[data-theme="dark"] .ch3{--cbg:#17352a;--cfg:#8fdcb3}:root[data-theme="dark"] .ch4{--cbg:#3a2a14;--cfg:#f0c58a}:root[data-theme="dark"] .ch5{--cbg:#3d1c21;--cfg:#f2a6ae}
.opts{display:flex;flex-direction:column;gap:6px;padding-left:2.2em}
.opt{font:inherit;text-align:left;display:flex;gap:10px;align-items:flex-start;background:none;border:1px solid transparent;border-radius:5px;padding:6px 8px;color:var(--ink);cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--line)}
.opt:focus-visible,.tabs button:focus-visible,.sa button:focus-visible,.sa input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.bub{flex:none;width:1.5em;height:1.5em;border:1.5px solid var(--muted);border-radius:50%;display:grid;place-items:center;font-size:.8rem;font-variant-numeric:tabular-nums}
.opt.right{background:var(--okbg)} .opt.right .bub{background:var(--ok);border-color:var(--ok);color:var(--paper)}
.opt.wrong{background:var(--nobg)} .opt.wrong .bub{background:var(--mark);border-color:var(--mark);color:var(--paper)}
.opt:disabled{cursor:default}
.exp{margin-left:2.2em;font-size:.88rem;border-left:3px solid var(--accent);padding:4px 0 4px 10px;color:var(--muted)}
.exp strong{color:var(--ink)}
.sa{padding-left:2.2em;display:flex;gap:8px;flex-wrap:wrap}
.sa input{font:inherit;flex:1;min-width:0;border:none;border-bottom:1.5px solid var(--muted);background:transparent;color:var(--ink);padding:4px 2px}
.sa button{font:inherit;font-size:.85rem;border:1px solid var(--accent);background:var(--paper);color:var(--accent);border-radius:4px;padding:4px 12px;cursor:pointer}
.res-ok{color:var(--ok);font-weight:700} .res-no{color:var(--mark);font-weight:700}
@media (prefers-reduced-motion:no-preference){.opt{transition:background .15s}}
</style>

<div class="wrap">
  <header style="display:flex;flex-direction:column;gap:8px">
    <h1>경영전략 중간고사 모의고사</h1>
    <p class="sub">실제 시험과 같은 구성: 객관식 25문항(3점) + 단답형 5문항(5점) = 100점, 성적 반영 30%. 장별 출제 비중(1장 9 · 2장 1 · 3장 8 · 4장 8 · 5장 4)도 그대로 맞췄어요. 보기를 누르면 바로 채점되고 해설이 나옵니다.</p>
    <div class="info"><span>시험 범위 1~5장</span><span>계산 문제 없음</span><span>ROIC 아래쪽(투하자본 분해)은 출제 제외</span><span>사례 적용 문항 포함</span></div>
  </header>
  <div class="bar">
    <div class="tabs" role="tablist" id="tabs"></div>
    <div class="score"><span>점수 <b id="pts">0</b> / <span id="tot">100</span></span><span id="prog"></span><span id="conv"></span><button class="wbtn" id="wrongBtn" type="button" aria-pressed="false">틀린 문제만 보기</button><button class="reset" id="retryBtn" type="button" hidden>틀린 문제 다시 풀기</button><button class="reset" id="reset" type="button">이 세트 다시 풀기</button></div>
  </div>
  <main id="main" style="display:flex;flex-direction:column;gap:12px"></main>
</div>

<script>
const S=[
/* ===== 예시문제 원본 ===== */
{name:"예시문제 (원본)",note:"교수님이 올린 중간고사 예시문제 원본 20문항이에요(1~16·18~20번 객관식, 17번 O/X). 정답은 공식 답안과 맞춰 확인했고, 해설은 강의안과 녹음을 기준으로 붙였어요. \"완전히 똑같은 문제도 있다\"고 하셨으니 답과 이유까지 외워두세요.",mc:[
{c:1,q:"다음 중 '전술'에 가장 가까운 것은 무엇입니까?",o:["앞으로 5년 안에 동남아 3개국에 진출해 해외 매출 비중을 30%로 높인다","업계 최저 원가로 대형 유통망에 표준 제품을 공급하는 사업자가 된다","이번 달 재고를 줄이려고 2주 동안 온라인몰에서 20% 할인 행사를 연다","보유한 발효 기술을 살려 건강기능식품 사업에 새로 진출한다"],a:2,e:"전술은 <b>특정 기능분야나 시장</b>에서 성과를 높이는 단기 활동이고, 전략은 경쟁우위를 위해 자원을 배분하는 <b>전반적인 계획</b>이에요.<br>①은 해외 진출(기업수준), ②는 업계 최저 원가 사업자(사업수준 저원가), ④는 신사업 진출(기업수준 다각화)이라 모두 전략이에요.<br>③은 '이번 달, 2주 동안, 온라인몰 할인'이라는 단기·특정 기능(마케팅) 활동이라 전술이에요."},
{c:3,q:"기업의 외부 환경을 체계적으로 이해하기 위해 사용되는 프레임워크는 무엇입니까?",o:["SWOT 분석","BCG 매트릭스","Porter의 5-force 모델","자원 기반 이론"],a:2,e:"강의안 표현 그대로 산업구조분석(5 Forces)은 \"<b>외부환경을 체계적으로 이해</b>하는 방법론\"이에요.<br>① SWOT은 내부와 외부를 함께 정리하는 도구, ② BCG는 사업부 간 자원 배분, ④ 자원기반이론은 <b>내부</b> 분석이에요.<br>⚠️ 함정: SWOT에도 외부(O·T)가 들어가지만, 외부를 체계적으로 이해하는 프레임워크는 5 Forces예요."},
{c:1,q:"Henry Mintzberg의 5P 프레임워크에 따르면 다음 중 전략의 5P에 속하지 않는 것은 무엇입니까?",o:["계획","패턴","책략","포트폴리오"],a:3,e:"5P = <b>계획·패턴</b>(전략이 무엇인가, WHAT) / <b>포지션·관점·책략</b>(어떻게 설계하나, HOW).<br>포트폴리오는 BCG 매트릭스 같은 사업부 자원배분 개념이라 헷갈리라고 넣은 보기예요."},
{c:1,q:"1990년대 자원 기반 관점(RBV)은 주로 무엇에 중점을 두었습니까?",o:["수익성에 영향을 미치는 외부 요인과 산업 구조의 이해","안정적인 성장을 위한 장기 전략 개발","경쟁 우위를 창출을 위한 회사의 내부 자원과 역량의 활용","성장 잠재력을 높이기 위한 국제 시장으로의 확장"],a:2,e:"바니의 자원기반이론: 경쟁우위는 <b>내부 자원과 역량</b>에 기초해요(SWOT의 S·W).<br>① 산업구조는 포터(1980년대), ② 장기 전략은 1950~60년대 장기전략계획, ④ 해외 확장은 기업수준 전략이에요."},
{c:1,q:"실현된 전략(realized strategy)에 대한 설명으로 옳은 것은 무엇입니까?",o:["최고경영진이 처음 계획한 전략이 그대로 실행된 것","계획된 전략 가운데 실제로 실행된 부분과, 실행 과정에서 새로 생겨난 전략을 합한 것","외부 컨설턴트가 수립해 준 전략","계획과 상관없이 현장에서 즉흥적으로 생긴 행동만을 뜻하는 것"],a:1,e:"<b>실현된 전략 = 계획된 전략 중 실제로 작동한 것 + 창발적 전략</b>이에요.<br>①은 계획대로만 된 것(창발적 전략이 빠짐), ④는 즉흥 행동만(계획이 빠짐)이라 둘 다 반쪽짜리예요."},
{c:1,q:"전략적 계획수립 과정에서 '전략 실행' 단계에 해당하는 활동은 무엇입니까?",o:["선택한 전략에 맞게 조직구조와 통제시스템을 설계하고 자원을 배분한다","경쟁자·고객·공급자를 분석해 사업 기회와 위협을 찾는다","회사가 존재하는 이유와 달성할 성과 기준을 정한다","회사의 강점과 약점이 되는 자원과 역량을 파악한다"],a:0,e:"실행 = 선택한 전략에 맞게 <b>조직구조와 통제시스템을 설계</b>하고 자원을 배분하는 것이에요.<br>②는 외부환경 분석(기회·위협), ③은 미션과 주요 목표 선정, ④는 내부환경 분석(강점·약점)이에요.<br>💡 5단계 순서: 미션·목표 → 외부 분석 → 내부 분석 → 전략 선택 → 실행. 각 단계와 내용을 짝지을 수 있어야 해요."},
{c:2,q:"잘 정의된 비전과 사명 선언문을 갖는 주요 이점은 무엇인가?",o:["일상 업무 효율 향상에 도움 제공","자원 배분, 성과 평가 등 모든 전략 기획 활동의 기반이 됨","회사의 즉각적인 재정적 성공 보장","회사가 항상 경쟁력 있는 가격 전략을 유지하도록 보장"],a:1,e:"강의안의 편익: 목적의 명확성 / <b>자원 할당·성과 평가 등 모든 전략기획 활동의 기반</b> / 이해관계자의 집중점 / 관리자 간 견해차 해소.<br>①은 너무 좁고, ③·④는 '<b>보장</b>'이라는 단정 표현이 함정이에요(실증 연구도 양(+)의 관계일 뿐 보장은 아님)."},
{c:3,q:"Porter의 5가지 힘 모델에 따르면 다음 중 경쟁에 영향을 주지 않는 것은 무엇입니까?",o:["공급자의 교섭력","신규 진입자의 위협","회사의 내부 경영구조","대체재의 위협"],a:2,e:"5 Forces = 기존 경쟁, 잠재 진입자, 대체재, 공급자 교섭력, 구매자 교섭력 → 모두 <b>외부</b> 요인이에요.<br>내부 경영구조는 4장(내부환경, 고급 생산요소의 조직 구조)에 해당해요."},
{c:3,q:"구매자의 교섭력에 영향을 미치는 핵심 요소는 무엇입니까?",o:["대체 공급자의 가용성","회사의 직원 규모","공급자의 전방통합 가능성","업계의 정부 규제"],a:0,e:"구매자가 <b>다른 공급자를 고를 수 있을 때</b>(대체 공급자가 많을 때) 구매자 교섭력이 커져요.<br>⚠️ 함정 ③: 공급자의 <b>전방통합</b>(공급자가 직접 생산·판매) 위협은 <b>공급자</b> 교섭력 요인이에요. 구매자 쪽은 <b>후방통합</b>(구매자가 직접 생산).<br>💡 의존 관점: 대체 공급자가 많으면 구매자는 특정 공급자에 덜 의존하니 구매자의 힘이 커져요."},
{c:3,q:"산업 수명 주기의 산업조정기 단계에서는 일반적으로 어떤 현상이 관찰됩니까?",o:["높은 진입장벽","업계 제품에 대한 급격한 수요 증가","약한 경쟁업체의 시장 퇴출","고객의 브랜드 충성도 감소"],a:2,e:"조정기: 성장 둔화, 대체수요만 남음, 초과공급 → 가격 인하 → <b>효율이 낮은 기업이 파산·도태</b>돼요.<br>① 높은 진입장벽은 성숙기, ② 수요 급증은 성장기의 특징이에요."},
{c:3,q:"어떤 거시경제적 요인이 산업 경쟁력에 큰 영향을 미칠 수 있습니까?",o:["회사 규모","인력의 다양성","인플레이션율","마케팅 예산"],a:2,e:"거시경제 4요소: <b>성장률, 이자율, 환율, 인플레이션율</b>.<br>① 회사 규모, ② 인력 다양성, ④ 마케팅 예산은 모두 <b>기업 내부</b> 요인이에요."},
{c:4,q:"다음 중 VRIO 프레임워크의 구성요소가 아닌 것은 무엇입니까?",o:["가치","희귀성","혁신성","조직화"],a:2,e:"VRIO = 가치(V), 희귀성(R), <b>모방 불가능성(I)</b>, 조직화(O).<br>⚠️ 함정: I를 Innovation(혁신)으로 착각하게 만든 보기예요. I는 <b>Inimitability</b>예요."},
{c:4,q:"다음 중 경쟁 우위에 기여하지 않는 것은 무엇입니까?",o:["독특한 제품이나 서비스의 제공","뛰어난 비용 효율성 달성","새로운 지리적 시장으로 확장.","혁신과 품질을 통한 차별화"],a:2,e:"경쟁우위의 방향은 <b>저원가(②)와 차별화(①·④)</b>이고, 구성요소는 효율성·품질·혁신·고객 대응성이에요.<br>지리적 확장은 <b>기업수준 전략</b>(해외 진출 여부)이라 그 자체로 경쟁우위를 만드는 요소가 아니에요."},
{c:4,q:"가치사슬 분석의 목적은 무엇인가요?",o:["외부 시장 상황 조사","생산 과정에서 가장 큰 가치를 창출하는 활동과 개선할 수 있는 활동의 식별","마케팅 전략의 평가","고객 만족도 수준 분석"],a:1,e:"강의안: 어떤 활동이 <b>가치를 창출하고 어떤 활동이 못 하는지</b> 파악 → 강점·약점 식별, 희귀하고 모방하기 어려운 자원이 <b>어디에 있는지</b> 파악.<br>① 외부 시장 조사는 3장, ③·④는 가치사슬의 일부 활동만 본 것이에요."},
{c:4,q:"회사의 수익성을 결정하는 요소가 아닌 요소는?",o:["고객이 제품에 부여하는 가치","회사의 가격 전략","제품 생산 비용","제품 혁신"],a:3,e:"수익성을 결정하는 3요인: <b>가치(V), 가격(P), 비용(C)</b>.<br>제품 혁신은 V나 C에 <b>영향을 줄 수는</b> 있지만 3요인 자체는 아니에요(경쟁우위 구성요소에 해당)."},
{c:5,q:"저비용 전략의 주요 이점은?",o:["브랜드 충성도 향상","고급 브랜드와 경쟁할 수 있는 능력","경쟁사가 손해를 보는 경우에도 유지될 수 있는 수익성","다양한 고객 부문을 위한 다양한 제품 라인 구축"],a:2,e:"강의안 그대로: 경쟁사들이 <b>적자를 내는 가격에서도 수익</b>을 낼 수 있어요.<br>① 브랜드 충성도, ② 고급 브랜드와 경쟁은 차별화 쪽이고, ④ 다양한 고객 부문별 제품 라인은 <b>세분화(차별적) 전략</b>이에요."},
{c:5,q:"블루오션 전략은 기존 산업 안에서 경쟁자보다 낮은 가격을 제시해 점유율을 빼앗는 전략이다.",o:["O","X"],a:1,e:"블루오션 = <b>가치혁신</b>으로 제품 구성을 재정립하고 <b>새로운 시장 공간을 창출</b>하는 전략이에요.<br>기존 산업 안에서 가격으로 싸우는 건 레드오션 경쟁이에요. 사우스웨스트도 다른 항공사가 아니라 <b>자가운전자·버스 이용자</b>를 경쟁자로 다시 정의했어요."},
{c:5,q:"다음 중 집중화 전략을 가장 잘 설명한 것은 무엇입니까?",o:["표준화된 제품으로 전체 시장에 서비스를 제공","맞춤형 제품을 통해 좁은 시장 부문에 집중","저비용 접근 방식으로 새로운 시장으로의 확장","여러 부문에 걸쳐 경쟁할 수 있는 다양한 제품 제공"],a:1,e:"집중화 = <b>한정된(소수의) 세분시장</b>에 집중 (예: 룰루레몬).<br>①은 표준화(비차별적), ④는 세분화(차별적) 전략이에요.<br>💡 집중화는 저원가(가성비형)와 차별화(포르쉐 같은 고부가가치형) 둘 다 가능하다는 것도 같이 기억하세요."},
{c:4,q:"고객 대응성은 무엇을 의미하는가?",o:["경쟁사보다 낮은 비용으로 제품을 생산할 수 있는 능력","고객의 요구를 신속하고 효과적으로 이해하고 충족시키는 능력","해외시장 진출 역량","장기 금융 투자에의 역량"],a:1,e:"고객 대응성 = 고객 요구를 <b>신속하고 효과적으로</b> 이해하고 충족하는 것(맞춤 제품, 대응 시간, A/S).<br>①은 효율성(저원가) 쪽 설명이에요."},
{c:4,q:"ROIC(투자 자본 수익률)은 무엇을 측정하는가?",o:["투자된 자본 대비 회사의 수익성","시간 경과에 따른 회사의 수익 성장","마케팅 전략의 효율성","직원 교육 프로그램의 효율성"],a:0,e:"ROIC = <b>영업활동의 세후 이익 ÷ 투하자본</b> → 투자된 자본 대비 수익성이에요.<br>계산 문제는 안 나오니 정의만 확실히 알아두세요."}
],sa:[]},
/* ===== SET 1 ===== */
{mc:[
{c:1,q:"교재에서 정의한 '경영전략'으로 가장 옳은 것은?",o:["조직의 일상 업무를 표준화하기 위한 절차","희소한 경영자원을 배분하여 기업에게 경쟁우위를 창출하고 유지시켜 줄 수 있는 주요한 의사결정","단기 매출 목표를 달성하기 위한 판촉 계획","외부 환경 변화를 예측하는 통계 기법"],a:1,e:"키워드는 희소한 자원, 경쟁상황, 선택과 포기(trade-off)입니다."},
{c:1,q:"'경쟁우위'의 정의로 옳은 것은?",o:["시장점유율이 업계 1위일 때 갖는 우위","매출 규모가 경쟁사보다 클 때 갖는 우위","기업의 수익성이 산업 평균 수익성보다 클 때 경쟁자에 대해 갖는 우위","직원 수가 경쟁사보다 많을 때 갖는 우위"],a:2,e:"기준은 매출이나 점유율이 아니라 '산업 평균 수익성'입니다."},
{c:1,q:"민츠버그의 5P 중 전략을 '어떻게(HOW) 실현하는가'에 해당하지 않는 것은?",o:["포지션","관점","책략","패턴"],a:3,e:"WHAT: 계획·패턴 / HOW: 포지션·관점·책략."},
{c:1,q:"LG전자가 2021년 휴대폰 사업을 종료하고 그 자원을 가전·로봇 등 강점 분야에 재투자했다. 이 결정은 어느 수준의 전략인가?",o:["기업수준 전략","사업수준 전략","기능수준 전략","전술"],a:0,e:"어느 사업에서 싸울지(사업 영역·철수·자원 배분)를 정하는 것은 기업수준 전략입니다."},
{c:1,q:"전략적 계획수립 5단계 모형의 첫 단계는?",o:["외부 경쟁환경 분석","기업의 미션과 주요 목표 선정","내부 운영환경 분석","전략 실행"],a:1,e:"미션·목표 → 외부(기회·위협) → 내부(강점·약점) → 전략 선정 → 실행."},
{c:1,q:"혼다는 대형 오토바이로 미국 시장을 공략하려 했으나 실패했고, 현지 직원이 타던 50cc 소형 오토바이에 대한 문의가 이어지면서 오히려 성공했다. 이 사례가 보여주는 개념은?",o:["시나리오 계획수립","창발적 전략","수직적 통합","분산된 계획수립"],a:1,e:"계획되지 않았지만 실행 과정에서 형성된 전략 = 창발적 전략."},
{c:1,q:"1970년대 오일쇼크 이후 경영전략의 변화로 옳은 것은?",o:["장기전략계획이 더욱 강화되었다","BCG 매트릭스가 처음 등장했다","시시각각 변하는 상황에 대응하고 조직원 전체의 전략적 사고가 필요해졌다","생성형 AI가 연구 주제로 부상했다"],a:2,e:"불확실성 증가 → 상황 대응·전 조직원의 전략적 사고, '경쟁' 키워드 부각. BCG는 1950~60년대 다각화 시기."},
{c:2,q:"'핵심 가치'에 대한 설명으로 옳은 것은?",o:["기업이 5년 이내에 이루고자 하는 미래의 모습이다","'우리의 사업은 무엇인가'에 대한 답이다","비전과 사명을 정립하는 데 필요한 윤리적 토대로, 기술 변화·유행을 초월한다","매년 바뀌는 매출 목표이다"],a:2,e:"핵심 가치 = 윤리적 토대, 조직 문화의 근간, 잘 변하지 않음."},
{c:3,q:"산업의 경계를 정의하는 기준으로 가장 적절한 것은?",o:["생산 설비의 종류","기업의 본사 위치","시장에서 만족시키고자 하는 기본 고객니즈","기업의 매출 규모"],a:2,e:"예: 코카콜라의 경쟁자는 펩시만이 아니라 생수·주스(같은 니즈)."},
{c:3,q:"진입장벽 구축에 영향을 미치는 요인이 아닌 것은?",o:["규모의 경제","브랜드 충성도","고객의 교체비용","산업 수요의 급증"],a:3,e:"진입장벽 요인: 규모의 경제, 브랜드 충성도, 절대원가우위, 고객의 교체비용, 정부 규제."},
{c:3,q:"기존 기업 간 경쟁 강도가 높아지는 상황으로 가장 옳은 것은?",o:["퇴출장벽이 낮아 쉽게 떠날 수 있다","산업 수요가 급증하고 있다","고정비가 높은 산업에서 수요가 감소하고 있다","제품 차별화가 매우 쉽다"],a:2,e:"고정비가 높으면 매출을 늘려야 해서 가격 인하 경쟁이 생기고, 수요 감소도 경쟁을 키웁니다."},
{c:3,q:"구매자의 교섭력이 높아지는 경우는?",o:["몇몇 구매자가 전체 주문량의 상당 부분을 구매할 때","구매자의 거래선 교체비용이 매우 높을 때","공급자 제품의 대체재가 거의 없을 때","구매자가 소량으로만 구매할 때"],a:0,e:"공급업체가 그 구매자에게 많이 의존할수록 구매자의 힘이 커집니다."},
{c:3,q:"포터의 5 Forces가 간과한 요소로, 산업 내 제품의 가치를 높여 수요와 수익을 늘리는 것은? (예: PC와 소프트웨어, 전기차와 충전소)",o:["대체재","보완재","잠재 경쟁자","전략집단"],a:1,e:"보완재가 많아지고 좋아질수록 산업 수요·수익이 증가합니다."},
{c:3,q:"산업수명주기 중 '잠재 경쟁자의 위협이 가장 높은' 단계는?",o:["도입기","성장기","성숙기","쇠퇴기"],a:1,e:"기술지식이 확산되고 규모의 경제·브랜드 충성도가 아직 덜 형성돼 진입장벽이 낮습니다."},
{c:3,q:"'이동장벽'에 대한 설명으로 옳은 것은?",o:["산업 내 전략집단 간 기업의 이동을 방해하는 요인이다","소비자가 다른 브랜드로 옮기는 비용이다","공장을 다른 지역으로 옮기는 비용이다","진입장벽과 퇴출장벽을 제외한 개념이다"],a:0,e:"이동장벽은 진입장벽·퇴출장벽을 포함합니다."},
{c:4,q:"VRIO 프레임워크에서 R(희귀성)이 묻는 질문은?",o:["기회 활용·위협 대처에 도움이 되는가?","경쟁사도 그 자원을 획득할 수 있는가?","자원을 활용하도록 조직화되어 있는가?","자원의 장부가치가 높은가?"],a:1,e:"희귀성은 경쟁자 대비 상대 개념입니다(K-뷰티 순위 역전 사례)."},
{c:4,q:"다음 중 '고급 생산요소'에 해당하지 않는 것은?",o:["프로세스 지식","조직 구조(설계)","지적 재산","토지"],a:3,e:"토지·노동·경영·시설·장비는 기본 생산요소입니다."},
{c:4,q:"가치(V)–가격(P)–비용(C) 구조에서 V–P가 의미하는 것은?",o:["이윤","창출된 가치","소비자잉여","투하자본"],a:2,e:"V–P 소비자잉여 / P–C 이윤 / V–C 창출된 가치."},
{c:4,q:"가치사슬의 '주활동'에 해당하지 않는 것은?",o:["생산","마케팅·영업","고객 서비스","인적자원"],a:3,e:"인적자원은 지원활동(R&D·조달·인적자원·정보시스템·기업 기반구조)."},
{c:4,q:"캐터필러는 세계 어디든 24시간 이내에 수리용 부품을 보내준다. 이는 가치사슬의 어떤 활동에서 가치를 창출한 사례인가?",o:["연구개발","고객 서비스","조달","기업의 기반구조"],a:1,e:"A/S·고객지원 = 주활동의 고객 서비스."},
{c:4,q:"경쟁우위의 4가지 구성요소 중 '유일함'을 제공하기 때문에 장기적으로 가장 중요한 것은?",o:["효율성","품질","혁신","고객 대응성"],a:2,e:"제품 혁신과 공정 혁신은 유일함을 제공합니다."},
{c:4,q:"ROIC(투하자본수익률)의 정의로 옳은 것은?",o:["세후 순이익 / 총자산","세후 순이익 / 자기자본","핵심 영업활동에서 창출한 세후 이익 / 투하자본","매출액 / 총자산"],a:2,e:"ROA = 순이익/총자산, ROE = 순이익/자기자본."},
{c:5,q:"사업수준 전략의 2가지 방향성은?",o:["다각화와 수직적 통합","저원가와 차별화","M&A와 해외 진출","시장침투와 시장개발"],a:1,e:"다각화·M&A·해외진출은 기업수준 전략입니다."},
{c:5,q:"커피 시장에서 저가 브랜드와 프리미엄 브랜드 사이의 애매한 포지션을 가진 브랜드의 성과가 나빠지고 있다. 포터의 관점에서 이 현상을 설명하는 개념은?",o:["가치혁신","어중간한 상태에 함몰(stuck in the middle)","블루오션","대량맞춤생산"],a:1,e:"포터: 분명한 선택을 하지 않으면 어중간한 상태에 함몰될 수 있다."},
{c:5,q:"블루오션의 4가지 질문(ERRC) 중 주로 '원가 절감'과 연결되는 두 가지는?",o:["제거, 감소","증가, 창조","제거, 창조","감소, 증가"],a:0,e:"제거·감소 → 원가↓ / 증가·창조 → 가치↑."}

{c:1,q:"실현된 전략 = 계획된 전략 중 실제로 작동한 것 + 계획되지 않은 (    ) 전략",a:["창발적","창발"],e:"정답: 창발적 전략"},
{c:1,q:"낙관적·부정적 시나리오를 조합해 각 시나리오별 전략과 단서 지표를 정하는 방법(플랜 A·B·C)은? (예: 로열더치쉘)",a:["시나리오계획수립","시나리오계획","시나리오"],e:"정답: 시나리오 계획수립"},
{c:3,q:"기업이 수익성이 낮아도 산업을 떠날 수 없도록 만드는 경제적·전략적·감성적 요인을 무엇이라 하는가?",a:["퇴출장벽"],e:"정답: 퇴출장벽 (예: 특수설비, 소포택배 전국망)"},
{c:4,q:"투입물을 고객 가치가 있는 산출물로 변환하기 위한 연쇄적인 활동(주활동 + 지원활동)을 무엇이라 하는가?",a:["가치사슬"],e:"정답: 가치사슬"},
{c:5,q:"혁신을 통해 효율화 곡선을 바깥으로 이동시켜 더 낮은 원가와 더 탁월한 차별화를 동시에 제공하는 것을 무엇이라 하는가?",a:["가치혁신"],e:"정답: 가치혁신 (예: 델)"}

/* ===== SET 2 ===== */
{mc:[
{c:1,q:"다음 중 '전술'에 가장 가까운 것은?",o:["3년 안에 일본 시장에 진출한다","적자인 음료 사업부를 매각한다","신메뉴 출시 기념으로 1주일간 SNS 쿠폰 이벤트를 연다","보유 기술을 활용해 의료기기 사업에 새로 진출한다"],a:2,e:"전술 = 특정 기능분야나 시장에서 성과를 높이는 것."},
{c:1,q:"'지속적 경쟁우위'에 대한 설명으로 옳은 것은?",o:["한 분기 동안 경쟁사보다 높은 이익을 낸 것","전략을 통해 여러 해에 걸쳐 산업 평균 이상의 수익성을 유지하는 것","시장점유율을 늘리기 위한 일회성 할인","경쟁사를 인수해 규모를 키우는 것"],a:1,e:"일회성이 아니라 여러 해에 걸쳐 유지되는 것 (예: 삼양식품)."},
{c:1,q:"경험·직감(휴리스틱), 게임이론, 과점 시장에서의 수읽기, 리얼옵션과 관련된 민츠버그의 P는?",o:["계획","관점","포지션","책략"],a:3,e:"책략(Ploy) = 전략의 인간적인 측면, 경쟁자의 허를 찌르는 시도."},
{c:1,q:"사업수준 경영자의 역할로 옳은 것은?",o:["기업 전체의 사업 범위를 결정한다","기업수준의 총괄 방향을 개별 사업의 구체적 전략으로 바꾼다","생산·구매 등 특정 기능만 책임진다","외부 이해관계자와의 법률 문제만 담당한다"],a:1,e:"사업부 책임자 = 사업수준 경영자."},
{c:1,q:"미션을 '제품지향적'이 아니라 '고객지향적'으로 정의해야 하는 이유는?",o:["제품 이름이 더 짧기 때문에","제품은 니즈 충족의 수단이라 기술 발전으로 변하지만 고객 니즈는 잘 변하지 않기 때문에","고객지향 미션은 법으로 정해져 있기 때문에","제품지향 미션은 비용이 많이 들기 때문에"],a:1,e:"예: 뉴욕타임스가 '신문'이 아니라 '정보 전달'로 정의 → 디지털 전환 대응."},
{c:1,q:"3M 연구원이 우연히 쏟은 냉매가 직물을 보호한다는 사실을 발견해 스카치가드를 만들었다. 창발적 전략의 원천 중 무엇에 해당하는가?",o:["뜻밖의 발견","시나리오 계획","하향식 계획","가격선도협약"],a:0,e:"창발적 전략의 원천: 예측하기 힘든 세계, 자율적 행동, 뜻밖의 발견."},
{c:1,q:"바니(Barney)의 자원기반이론이 SWOT 분석에서 주로 다루는 영역은?",o:["기회와 위협","강점과 약점","기회와 강점","위협과 약점"],a:1,e:"포터의 산업구조분석 = O·T(외부) / 자원기반이론 = S·W(내부)."},
{c:2,q:"비전 선언문의 특성으로 적절하지 않은 것은?",o:["명확함","미래형(5년 이내)","간결함(한 문장)","여러 문단에 걸친 상세한 서술"],a:3,e:"명확함·미래형·간결함·독특함·영감적."},
{c:3,q:"5 Forces 중 '경쟁' 차원이 아니라 '힘(교섭력)' 차원에 해당하는 것은?",o:["기존 기업 간 경쟁","잠재 경쟁자","대체재","공급자의 교섭력"],a:3,e:"경쟁 3개(기존·잠재·대체재) + 힘 2개(공급자·구매자)."},
{c:3,q:"잠재 경쟁자의 진입 위험을 결정하는 두 요소는?",o:["산업의 매력성과 진입장벽의 높이","환율과 이자율","공급자 수와 구매자 수","광고비와 R&D비"],a:0,e:"매력적이어도 진입장벽(예: 반도체 기술 격차)이 높으면 못 들어옵니다."},
{c:3,q:"'통합된 산업'의 특징으로 옳은 것은?",o:["다수의 중소기업으로 구성된다","진입장벽이 매우 낮다","소수 대기업이 서로 상호의존적이다","동네 세탁소가 대표적 예다"],a:2,e:"예: 시리얼, 통신사, 정유사. 한 기업의 가격 변화가 경쟁사에 직접 영향."},
{c:3,q:"공급자의 교섭력이 높아지는 경우는?",o:["공급자 제품의 대체재가 거의 없고 구매 기업에 중요할 때","구매 기업이 공급자를 쉽게 바꿀 수 있을 때","해당 산업이 공급자에게 매우 중요할 때","공급자가 매우 많을 때"],a:0,e:"예: PC 산업의 인텔."},
{c:3,q:"캐나다 중소기업 코트(Cott)가 월마트 등 유통업체의 PB 콜라를 공급해 시장에 들어간 사례가 보여주는 것은?",o:["진입장벽 우회","퇴출장벽","보완재 효과","가격선도협약"],a:0,e:"코카콜라·펩시의 강한 브랜드 충성도라는 장벽을 PB로 우회."},
{c:3,q:"산업수명주기 중 '성숙기'의 특징은?",o:["구매자가 제품을 잘 몰라 성장이 느리다","진입장벽이 높고 소수 과점 기업이 가격선도협약으로 가격전쟁을 피하려 한다","수요가 급증하고 신규 진입이 가장 활발하다","초과공급으로 효율 낮은 기업이 대거 파산한다"],a:1,e:"조정기를 거쳐 살아남은 소수 기업 중심."},
{c:3,q:"원화 가치가 크게 하락했다. 거시환경 분석 관점에서 수출 기업에 미치는 영향으로 옳은 것은?",o:["수출 기회 증가","수출 기회 감소","영향 없음","수입품 경쟁 위협 증가"],a:0,e:"환율(경제적 요인): 원화 약세 → 수출 기회↑, 수입품 위협↓."},
{c:4,q:"토요타의 JIT 재고 시스템·린 생산방식처럼, 경쟁사와 구별하거나 상당히 낮은 비용으로 생산하게 하는 기업별 강점은?",o:["독보적 역량","기본 생산요소","보완재","이동장벽"],a:0,e:"독보적 역량(강점)은 여러 자원이 결합해 만들어집니다. 토요타의 린 생산은 수십 년 쌓인 생산 노하우(프로세스 지식) + 현장 개선 문화(조직 구조) + 공장·설비가 합쳐진 결과라, 공장만 똑같이 지어서는 따라 할 수 없습니다."},
{c:4,q:"'프로세스 지식'의 특징으로 옳지 않은 것은?",o:["시간과 경험을 통해 축적된다","여러 개인·팀·부서에 퍼져 있다","암묵적 특성을 가진다","문서화되어 있어 다른 기업이 쉽게 따라 할 수 있다"],a:3,e:"암묵적이라 식별도, 구현도 어려워 모방 장벽이 됩니다."},
{c:4,q:"보잉이 비용 절감을 위해 수평안정기 생산을 중국 공장에 맡겼다가 기술이 유출된 사례의 시사점은?",o:["아웃소싱 여부를 정할 때 지적 재산·지식 유출 방지가 중요하다","항상 아웃소싱이 유리하다","기본 생산요소가 가장 중요하다","가격은 가치와 같아야 한다"],a:0,e:"모방 장벽 보호 필요 (반대로 코카콜라 레시피는 철저히 보호)."},
{c:4,q:"차별화 기업이 가격을 조금만 올려 수요를 늘리고 규모의 경제로 원가를 낮추려는 전략(옵션 2)이 실현 불가능해지는 경우는?",o:["수요가 늘지 않거나 규모의 경제가 생기지 않을 때","경쟁사가 없을 때","소비자잉여가 클 때","브랜드 충성도가 높을 때"],a:0,e:"가치·가격·수요·비용의 동적 관계를 이해해야 합니다."},
{c:4,q:"가치사슬의 '지원활동'에 해당하지 않는 것은?",o:["연구개발","조달(물류관리)","정보시스템","고객 서비스"],a:3,e:"고객 서비스는 주활동입니다."},
{c:4,q:"품질 중 '신뢰성(일관된 성능, 적은 고장)'이 경쟁우위에 기여하는 방향으로 옳은 것은?",o:["종업원 생산성 향상과 단위원가 절감","제품 수명주기 단축","시장 세분화","진입장벽 하락"],a:0,e:"우수성 → 차별화 / 신뢰성 → 낮은 비용(+차별화)."},
{c:4,q:"룰루레몬이 갭보다 ROIC가 훨씬 높았던 주된 원인은?",o:["투하자본 대비 매출액이 훨씬 높아서","매출원가 비율이 낮아(높은 마진) — 디자인·원단 R&D로 만든 강력한 브랜드 덕분","판매관리비를 거의 쓰지 않아서","매장 수가 갭보다 많아서"],a:1,e:"자본회전율은 비슷했고 차이는 수익성(매출원가 44.2% vs 62.6%)에서 났습니다."},
{c:5,q:"잘된 시장세분화의 조건은?",o:["그룹 내 이질적, 그룹 간 동질적","그룹 내 동질적, 그룹 간 이질적","모든 그룹의 크기가 같아야 함","그룹이 하나뿐이어야 함"],a:1,e:"같은 그룹은 욕구가 비슷하고, 다른 그룹과는 욕구가 달라야 합니다."},
{c:5,q:"O/X: 저원가 전략을 쓰는 기업은 차별화를 완전히 무시해도 된다.",o:["O","X"],a:1,e:"X. 코스트코도 매장 직원·주차장 등 고객이 납득할 기본 차별화는 갖춥니다."},

{c:1,q:"전략적 계획수립에서 '주요 목표'의 조건으로 옳지 않은 것은?",o:["정확하고 측정 가능해야 한다","도전적이면서 현실적이어야 한다","달성 기간이 구체적이어야 한다","가능한 모든 목표를 빠짐없이 담아야 한다"],a:3,e:"자원이 한정돼 있으니 '결정적인 이슈' 위주로 우선순위."},
{c:1,q:"GE는 가구원 수 감소를 보고 가전 소형화를 추진했으나, 주방·화장실 공간은 줄지 않아 실패했다. 이 사례가 강조하는 것은?",o:["분산된 계획수립(Top-down + Bottom-up)","시나리오 계획수립","리얼옵션","가격선도협약"],a:0,e:"CEO만의 계획은 탁상공론이 될 수 있습니다."},
{c:1,q:"창발적 전략에 대한 민츠버그의 견해로 옳은 것은?",o:["창발적 전략은 항상 실패한다","창발적 전략이 의도적 전략보다 더 성공적이고 적절할 수 있다","창발적 전략은 CEO만 만들 수 있다","창발적 전략은 계획과 같은 말이다"],a:1,e:"유연한 조직문화가 창발적 전략을 만드는 능력에 영향."},
{c:2,q:"마이크로소프트 초기의 '모든 사무실 책상과 가정에 컴퓨터를'은 무엇에 해당하는가?",o:["핵심 가치","비전","사명","전술"],a:1,e:"비전 = 소망하는 미래의 상태."},
{c:3,q:"'잠재 경쟁자'의 정의로 옳은 것은?",o:["이미 시장에서 경쟁 중인 기업","현재 경쟁하지 않지만 선택에 따라 경쟁할 수 있는 역량을 가진 기업","원료를 공급하는 기업","제품을 구매하는 기업"],a:1,e:"예: 스트리밍 시장의 디즈니·파라마운트."},
{c:3,q:"'절대원가우위'의 원천으로 옳지 않은 것은?",o:["경험·특허·거래비밀에 기반한 우수한 생산 프로세스","공급이 제한된 투입요소 확보","더 저렴한 자금조달 능력","소비자의 브랜드 선호"],a:3,e:"브랜드 선호는 '브랜드 충성도'라는 별도의 진입장벽 요인."},
{c:3,q:"'파편화된 산업'의 특징은?",o:["소수 대기업이 상호의존적이다","진입장벽이 낮고 차별화가 어려운 생활필수품 중심의 다수 중소기업","정부가 독점한다","가격선도협약이 흔하다"],a:1,e:"예: 동네 세탁소."},
{c:3,q:"국내 제분 7개사(B2B 점유율 87.7%)의 가격 담합 사례에서, 통합된 산업의 기업들이 가격 경쟁을 피하려는 이유는?",o:["가격을 내리면 경쟁사도 따라 내려 점유율은 그대로이고 수익만 줄기 때문","정부가 가격 인하를 금지해서","원재료가 무한해서","소비자가 비싼 밀가루를 선호해서"],a:0,e:"상호의존성 → 암묵적 가격 질서(또는 불법 담합)."},
{c:3,q:"MS가 블리자드를 인수해 인기 게임 프랜차이즈를 독점하려 한 것은 5 Forces 밖의 어떤 요소와 관련 있는가?",o:["대체재","보완재","퇴출장벽","전략집단"],a:1,e:"게임은 콘솔의 보완재. 강력한 보완 공급업체에 대한 의존을 줄이려는 시도."},
{c:3,q:"산업수명주기 '도입기'의 주요 경쟁 요소는?",o:["가격 인하","고객 교육, 유통망 구축, 제품설계 완성도","가격선도협약","초과생산능력 정리"],a:1,e:"구매자가 제품을 잘 모르고 유통망이 없어 성장이 느린 단계."},
{c:3,q:"다음 중 PESTEL의 '사회적' 요인에 해당하는 것은?",o:["한국은행 기준금리 인상","65세 이상 인구 20% 돌파","건강 관심 증가로 제로칼로리·프로틴 음료 확산","항공산업 규제완화"],a:2,e:"금리=경제, 고령화=인구통계, 규제완화=정치·법."},
{c:4,q:"'자원'의 정의로 옳은 것은?",o:["회사가 입력을 출력으로 변환해 시장에서 판매할 수 있게 하는 요소(회사의 자산)","고객이 제품에 부여하는 효용","경쟁사의 시장점유율","정부의 산업 정책"],a:0,e:"자원 = 재료, 독보적 역량 = 그 재료로 만든 강점. 역량은 하나 이상의 자원에 토대를 둡니다."},
{c:4,q:"고급 생산요소가 기본 생산요소보다 경쟁우위에 더 중요한 이유는?",o:["희귀성과 모방 장벽을 더 많이 만들어내기 때문","항상 더 싸기 때문","회계상 자산으로 잡히기 때문","정부가 보호해주기 때문"],a:0,e:"프로세스 지식·조직 구조·지적 재산은 시간이 필요하고 고유한 문화 안에서 형성."},
{c:4,q:"한국콜마·코스맥스 같은 화장품 ODM 기업의 경쟁력 원천으로 강의에서 제시한 것은?",o:["처방·배합·양산의 프로세스 지식","대규모 TV 광고","정부 독점 허가","저렴한 토지"],a:0,e:"문서화되지 않고 여러 부서에 퍼져 있어 모방 장벽이 성립."},
{c:4,q:"기업의 수익성을 결정하는 3가지 요인이 아닌 것은?",o:["고객이 제품에 부여하는 가치","기업이 부과하는 가격","제품을 만드는 비용","시장점유율"],a:3,e:"V·P·C. 점유율이 높아도 영업이익은 낮을 수 있음(삼성 vs 애플)."},
{c:4,q:"1997년 위기의 버버리는 세계적 디자이너를 영입해 진부한 패션라인을 재설계했다. 가치사슬 중 주로 어떤 활동인가?",o:["연구개발","고객 서비스","조달","인적자원"],a:0,e:"디자인·기능성 향상을 통한 가치 증대 = R&D(지원활동). 광고는 마케팅, 팀워크는 기반구조."},
{c:4,q:"'고객 대응성'을 구성하는 요소가 아닌 것은?",o:["개별 맞춤 제품","고객 대응시간 단축","탁월한 A/S와 고객지원","원재료 대량구매 할인"],a:3,e:"대량구매 할인은 규모의 경제(비용) 쪽입니다."},
{c:4,q:"ROE의 정의로 옳은 것은?",o:["세후 순이익 / 자기자본","세후 순이익 / 총자산","세후 영업이익 / 투하자본","매출액 / 투하자본"],a:0,e:"자기 돈 기준 = ROE, 전체 자산 기준 = ROA."},
{c:5,q:"아마존은 창업 초기 문짝으로 만든 책상을 지금도 상징처럼 쓰며 효율성 문화를 강조한다. 사업수준 전략 실행에서 이것이 보여주는 것은?",o:["사업수준 전략–기능 전략–조직이 정렬되어야 한다","블루오션 창출","보완재 확보","시장세분화"],a:0,e:"저원가 전략이면 조직 구조·인센티브·문화도 효율성을 강조해야 합니다."},
{c:5,q:"포르쉐처럼 고소득·고부가가치 세분시장에 집중하는 기업의 원가 특징은?",o:["소비자 욕구 충족을 위해 원가가 높고, 한정된 시장이라 규모의 경제가 어렵다","원가가 가장 낮다","규모의 경제가 가장 크다","원가 구조가 표준화 전략과 같다"],a:0,e:"집중화는 두 방향: 고소득·고부가가치(원가↑) vs 가성비(원가↓, 예: 코스트코)."},
{c:5,q:"O/X: 포터는 차별화와 저원가를 동시에 추구할 수 있다고 주장했다.",o:["O","X"],a:1,e:"X. 포터는 동시 추구 불가를 주장. 반론은 가치혁신으로 효율화 곡선이 바깥으로 이동하면 가능하다는 것."}
],sa:[
{c:1,q:"경쟁우위: 기업의 수익성이 (          )보다 클 때 경쟁자에 대해 갖는 우위",a:["산업평균수익성","산업평균"],e:"정답: 산업 평균 수익성"},
{c:1,q:"인사, R&D, 재무, 생산, 마케팅 조직 단위의 전략은 어느 수준의 전략인가?",a:["기능별전략","기능수준전략","기능수준","기능별"],e:"정답: 기능별(기능수준) 전략"},
{c:3,q:"산업 내 기업 제품의 가치를 보완적으로 증대시키는 제품으로, 포터가 간과한 요소는?",a:["보완재"],e:"정답: 보완재"},
{c:4,q:"경쟁우위의 4가지 구성요소 중 Output/Input으로 측정하며 주로 낮은 비용과 연결되는 것은?",a:["효율성"],e:"정답: 효율성"},
{c:5,q:"본원적 사업수준 전략 중, 좁은 세분시장(부유층)을 대상으로 고가 차별화를 추구한 리비안 전기 픽업트럭에 해당하는 전략은?",a:["집중화된차별화","집중화차별화","차별화집중"],e:"정답: 집중화된 차별화"}
]},
/* ===== SET 5: 동영상 강의에서 짚지 않은 20% ===== */
{name:"세트 5 · 나머지 20%",note:"동영상 강의에서 짚지 않고 넘어간 슬라이드와 수업 중 설명(도입 사례, 보충 개념, 국내 사례)에서만 출제한 세트예요. 장별 비중: 1장 9 · 3장 9 · 4장 8 · 5장 4.",mc:[
{c:1,q:"쿠팡·네이버·SSG는 같은 이커머스 산업에 있지만 각각 물류, 포털 트래픽, 식료품·오프라인 매장에 강점을 두며 성과가 다르다. 이 도입 사례가 말하려는 것은?",o:["경쟁기업 간 성과 차이의 주된 이유는 전략이다","산업이 같으면 성과도 같다","전략은 CEO와 기획실만의 일이다","규모가 큰 기업이 항상 이긴다"],a:0,e:"같은 산업, 다른 전략 → 다른 성과. 그래서 모든 구성원이 전략적 사고를 갖춰야 한다는 것까지 연결됩니다."},
{c:1,q:"교재의 경영전략 정의에 담긴 3가지 키워드가 아닌 것은?",o:["희소한 경영자원","경쟁상황","선택과 포기(trade-off)","충분한 자원의 확보"],a:3,e:"자원이 한정돼 있으니 배분하고, 경쟁이 있으니 우위가 필요하며, 그래서 선택과 포기가 따릅니다."},
{c:1,q:"손자병법의 도·천·지·장·법을 현대 경영에 매칭할 때 '지(地, 지형)'에 해당하는 것은?",o:["미션과 목표","외부환경의 변화","산업 구조","조직구조와 관리프로세스"],a:2,e:"도=미션·목표 / 천=외부환경 변화 / 지=산업 구조 / 장=리더십 / 법=조직구조·관리프로세스."},
{c:1,q:"앤소프의 성장전략(제품 × 시장)에서 '기존 제품을 신규 시장'에 파는 전략은?",o:["시장침투","시장개발","제품개발","다각화"],a:1,e:"기존·기존=시장침투 / 기존 제품·신규 시장=시장개발 / 신규 제품·기존 시장=제품개발 / 신규·신규=다각화."},
{c:1,q:"카카오톡을 쓰는 가장 큰 이유가 '주변 사람이 다 써서'인 것처럼, 사용자가 많을수록 서비스의 가치가 커지는 현상은? (경영전략 최신 경향)",o:["규모의 경제","네트워크 효과","경험 효과","단속균형"],a:1,e:"네트워크 경제성. 아마존 플라이휠, 에어비앤비도 같은 예입니다."},
{c:1,q:"올리브영은 공격적 출점·접근성에 집중해 성공했고, 같은 H&B 포맷의 랄라블라·롭스는 철수했다. 이 사례가 보여주는 것은?",o:["같은 포맷이라도 비즈니스모델에 따라 성과가 달라진다","H&B 산업은 매력이 없다","대기업 계열사는 항상 실패한다","상품 구색이 많을수록 성공한다"],a:0,e:"SWOT 분석 → 고객 수요와 자원·역량을 가장 잘 연계하는 고유 비즈니스모델 구축."},
{c:1,q:"하향식 '전략적 계획수립 모형'에 제기된 의문이 아닌 것은?",o:["현실 세계는 예측하기 어렵다","하위수준 경영자도 전략 수립에서 역할을 한다","성공한 전략 상당수가 우연적 상황의 결과다","CEO는 모든 정보를 완벽히 알고 있다"],a:3,e:"오히려 CEO도 모든 걸 알 수 없다는 게 의문의 출발점. '누구나 맞기 전에는 다 계획이 있다'(마이크 타이슨)."},
{c:1,q:"삼성의 자동차 진출이 외부·내부 분석보다 최고경영자의 개인적 선호에서 비롯된 측면이 있다고 설명된다. 민츠버그 5P 중 무엇과 가장 관련 있는가?",o:["계획","포지션","관점","책략"],a:3,e:"책략 = 전략의 인간적 측면. 개인의 영향력·관계·감정이 전략 행동으로 이어지는 것."},
{c:3,q:"강의 도입 사례(넷플릭스 스트리밍 전쟁)에 들어 있는 외부환경 분석 틀이 아닌 것은?",o:["5 Forces","산업수명주기","거시환경","VRIO"],a:3,e:"클라우드·광통신(거시환경), 도입기→성숙기(수명주기), 훌루·디즈니 진입(5 Forces). VRIO는 4장 내부 분석."},
{c:3,q:"초기 SCP 모델의 흐름으로 옳은 것은?",o:["전략 → 비용 → 가격","구조 → 행동 → 성과","공급 → 소비 → 가격","성과 → 구조 → 행동"],a:1,e:"Structure–Conduct–Performance. 포터는 같은 산업에서도 행동·성과가 다르고, 구조도 기업 행동으로 바뀔 수 있다고 봤습니다."},
{c:3,q:"스타필드가 '우리의 경쟁사는 야구장'이라고 말한 것은 어떤 개념과 연결되는가?",o:["산업의 경계를 기본 고객니즈(고객의 시간) 기준으로 넓게 정의","진입장벽 구축","가격선도협약","퇴출장벽"],a:0,e:"산업의 경계는 기본 고객니즈로 정해지고, 바뀔 수 있습니다."},
{c:3,q:"월마트 같은 유통업체가 PB(자체 브랜드) 상품을 원하는 이유로 강의에서 설명한 것은?",o:["가격은 싸도 마진이 크고, 그 매장에서만 살 수 있어 상품구색이 차별화된다","정부가 PB를 의무화했다","제조사 브랜드보다 품질이 항상 높다","광고비가 더 많이 든다"],a:0,e:"이 수요 덕분에 코트(Cott)가 PB 공급으로 진입장벽을 우회할 수 있었습니다."},
{c:3,q:"타이어 산업에 신규 업체가 들어오자 기존 경쟁이 치열해지고, 자동차 회사(구매자)는 선택지가 늘어 교섭력이 커졌다. 5 Forces 분석의 어떤 시사점인가?",o:["하나의 경쟁요소가 다른 요소에 영향을 미친다","5 Forces는 서로 독립적이다","구매자 교섭력은 변하지 않는다","신규 진입은 항상 기존 기업에 유리하다"],a:0,e:"진입장벽 하락 → 신규 진입 → 공급자·구매자의 힘까지 바뀔 수 있습니다."},
{c:3,q:"1990년대 미국 시리얼 산업에서 암묵적 가격 질서가 무너진 원인으로 옳은 것은?",o:["라떼·베이글 같은 대체재 확산과 월마트 PB 선호 증가","정부의 가격 통제","켈로그의 파산","원재료 공급 중단"],a:0,e:"매출이 줄자 가격 경쟁 → 켈로그(가격 선도자)가 이끌던 질서 붕괴."},
{c:3,q:"산업수명주기 모형의 한계로 강의에서 든 예로 옳은 것은?",o:["자동차는 성숙기에 오래 머물고, 진공관은 성숙기를 건너뛰고 쇠퇴기로 갔다","모든 산업은 같은 속도로 5단계를 거친다","도입기가 가장 길다","쇠퇴기에는 경쟁이 사라진다"],a:0,e:"수명주기는 일반화된 모형일 뿐, 산업마다 패턴과 단계별 간격이 다릅니다."},
{c:3,q:"'단속균형'에 대한 설명으로 옳은 것은?",o:["안정된 산업구조가 혁신에 의해 급속히 깨지고, 시간이 지나 다시 소수로 재편되는 것","산업이 영원히 균형을 유지하는 것","정부 규제로 가격이 고정되는 것","수요와 공급이 정확히 일치하는 것"],a:0,e:"포터: 혁신은 산업구조를 녹였다가 다시 구축한다. 예: AI로 많은 기업이 진입(파편화) → 이후 재편."},
{c:4,q:"이케아가 기존 가구보다 약 30% 싸게 팔 수 있었던 핵심 이유로 슬라이드에 제시된 것은?",o:["평면 포장이 가능한 가구 디자인으로 운송·저장 비용 절감","고급 원목만 사용","백화점 입점","주문 후 2~3개월 배송"],a:0,e:"장기 협력업체와의 원가 절감 + 평면 포장 디자인. 강점은 디자인·제조·물류."},
{c:4,q:"교수님의 식당 비유에서 '레시피'에 해당하는 개념은?",o:["자원","능력","독보적 역량","보완재"],a:1,e:"자원=재료·식당·요리사 / 능력=레시피 / 독보적 역량=미슐랭급 레시피."},
{c:4,q:"입력을 출력으로 바꾸는 변환 프로세스의 효율성·효과성을 결정하는 것은?",o:["자원의 품질과 프로세스 지식·조직 구조·지적 재산권의 품질","광고 예산의 크기","경쟁사의 수","시장 성장률"],a:0,e:"기본 생산요소에 고급 생산요소가 어떻게 덧입혀지느냐에 따라 달라집니다."},
{c:4,q:"ZARA가 재고를 매출 대비 약 10%(경쟁사 약 15%)로 낮게 유지해 얻은 효과는?",o:["자금운영 개선과 가격할인 빈도 감소로 수익성 개선","매장 수 감소","디자인 다양성 감소","배송 속도 저하"],a:0,e:"디자인·정보시스템·물류관리 역량을 기반으로 한 결과입니다."},
{c:4,q:"F&F(영업이익률 24.2%)와 한섬(3.5%)의 격차 약 20%p는 주로 어디서 생겼는가?",o:["매출총이익률 차이 약 10%p + 판매관리비율 차이 약 10%p","매출액이 4배 차이 나서","F&F의 연구개발비가 0이라서","한섬의 투하자본이 더 커서"],a:0,e:"F&F는 원가 대비 높은 가격(총이익률 66.8% vs 56.3%)을 받으면서 판관비율은 낮음(42.6% vs 52.8%)."},
{c:4,q:"룰루레몬과 갭의 '판매관리비+연구개발비/매출액' 비율은 33.4% vs 33.9%로 비슷했다. 그런데도 차이를 만든 것은?",o:["지출 구성: 룰루레몬은 디자인·원료 R&D 비중이, 갭은 판매관리비 비중이 높음","룰루레몬이 광고를 전혀 하지 않음","갭의 R&D 비중이 더 높음","두 회사의 지출 구성은 완전히 같음"],a:0,e:"같은 비용이라도 어디에 썼는지가 차별화(희귀·모방 어려운 자원)를 만들었습니다."},
{c:5,q:"리비안이 목표로 한 규모의 경제 달성에 차질을 빚은 원인은?",o:["공급망 문제","사전 주문 부족","아마존의 지분 매각","저가 전략 실패"],a:0,e:"사전주문 7만 건+, 아마존 10만 건이 있었지만 공급망 문제로 생산 확대가 어려웠습니다."},
{c:5,q:"효율화 곡선이 직선이 아니라 볼록하게 그려지는 이유로 교수님이 설명한 것은?",o:["이미 높은 수준에서 한 단계 더 올리려면 훨씬 많은 비용이 들기 때문","모든 기업의 비용이 같기 때문","차별화는 비용과 관계없기 때문","정부 규제 때문"],a:0,e:"성적 비유: 중간까지는 쉽게 올라가도 상위권에서 한 단계 올리기는 훨씬 어렵습니다."},
{c:5,q:"사우스웨스트항공이 허브 공항 경유 없이 직항만 운항한 이유로 강의에서 설명한 것은?",o:["경유하면 연착·지연으로 도착시간 불확실성이 커져 목표 고객이 원하는 신뢰·편리를 해치기 때문","경유 공항 이용료가 무료라서","승객을 더 많이 태우기 위해서","기내식을 제공하기 위해서"],a:0,e:"승객 수만 보면 경유가 유리하지만, 타깃(자가운전·버스 이용자)이 중시하는 가치를 우선했습니다."}
],sa:[
{c:1,q:"특정 시장에 제품·서비스를 공급하며 재무·구매·생산·마케팅 기능을 독자적으로 운영하는 사업부를 무엇이라 하는가?",a:["사업단위","전략사업단위","sbu"],e:"정답: 사업단위 (예: LG생활건강의 Beauty·HDB·Refreshment)"},
{c:3,q:"부채의 실질가치를 증가시켜 부채가 많은 개인·기업에 부담을 주는 거시경제 현상은?",a:["디플레이션"],e:"정답: 디플레이션 (인플레이션은 성장 둔화·이자율 상승·경제 불안정)"},
{c:4,q:"품질의 두 차원: 디자인·기능의 '우수성'과, 일관되게 기능하고 고장이 적은 (      )",a:["신뢰성"],e:"정답: 신뢰성 (우수성 → 차별화 / 신뢰성 → 생산성↑·원가↓)"},
{c:4,q:"ROA를 (순이익/매출액) × (매출액/총자산)으로 분해할 때, 뒤쪽 '매출액/총자산'을 무엇이라 하는가?",a:["자산회전율","총자산회전율"],e:"정답: 자산회전율 (자산을 굴려 매출을 얼마나 냈나)"},
{c:5,q:"세분화(차별적) 전략의 높은 원가를 낮추기 위해 공유 가능한 부품을 늘려 규모의 경제를 얻으면서 각 고객집단의 니즈도 충족하는 방식은?",a:["대량맞춤생산","대량맞춤","매스커스터마이제이션"],e:"정답: 대량맞춤생산 (예: 경차·중형·대형차의 공통 부품 모듈화)"}
]},
/* ===== SET 6: 20% 심화 ===== */
{name:"세트 6 · 20% 심화",note:"세트 5에 나온 주제는 빼고, 동영상 강의 밖 20%(슬라이드 세부 + 수업 중 설명)에서 최대한 많이 낸 세트예요. 문항 수가 많아 만점이 100점이 아니니 30점 환산 점수로 보세요.",mc:[
{c:1,q:"강의안에 소개된 경영전략의 다양한 정의들에 공통으로 들어 있는 3요소는?",o:["조직, 목표, 목표 달성을 위한 경로","가격, 제품, 유통","자원, 역량, 성과","고객, 경쟁사, 환경"],a:0,e:"그래서 전략 = '특정 조직이 어떤 목표를 달성하기 위한 경로'라는 기본 골격으로 이어집니다."},
{c:1,q:"슬라이드에 제시된 비즈니스모델의 구성 요소가 아닌 것은?",o:["고객 선정","제품 정의 및 차별화","원가 절감","산업수명주기 예측"],a:3,e:"고객 선정 / 제품 정의·차별화 / 고객 가치 창출·확보·유지 / 생산성 향상 / 원가 절감 / 기업 내 활동 결합."},
{c:1,q:"전략의 '경로'는 시장과 비시장으로 나뉜다. '일본 시장에 어떻게 진출할 것인가'를 정하는 것은?",o:["시장 경로","비시장 경로","전술","기능별 전략"],a:1,e:"시장 경로 = 일본 시장 안에서 어떻게 싸울지 / 비시장 = 진출 방식처럼 더 넓은 차원."},
{c:1,q:"(교수님이 넘어간 슬라이드) 주주가치 극대화가 중요한 이유로 제시된 것은?",o:["주주는 위험자본을 제공하고 회사의 법적 주인이기 때문","주주가 제품을 가장 많이 사기 때문","주주가 경영을 직접 하기 때문","주주가치는 법으로 보장되기 때문"],a:0,e:"주주가치 = 주가 상승 + 배당금. 증가 조건은 수익성과 이익증가율."},
{c:1,q:"민츠버그 5P 중 '패턴'에 대한 슬라이드 설명으로 옳은 것은?",o:["미래 예측을 바탕으로 한 행동 계획","과거 행동과 그 분석 기반 체계로, 관측할 수 없는 전략도 있고 도중에 중단되기도 한다","외부 환경 측정으로 자사 위치를 모색","비시장 요인을 활용해 경쟁자의 의표를 찌름"],a:1,e:"①계획 ③포지션 ④책략."},
{c:1,q:"계획과 패턴 사이에 존재하는 스타트업의 '창발적 프로세스' 특징으로 옳은 것은?",o:["장기 계획을 정밀하게 세운 뒤 그대로 실행한다","산업·조직 구조 이해보다 비즈니스모델을 정한 뒤 대응하며 변화를 만들어 간다","외부 컨설턴트가 전략을 정한다","패턴을 만들지 않는다"],a:1,e:"계획은 모호하게, 유연함·민첩함으로 대처하며 패턴을 확보."},
{c:1,q:"쇼핑몰이 상세페이지 A안·B안을 테스트해 반응 좋은 쪽을 계속 채택하며 방식이 쌓여 간다. 강의에서 이 예가 설명한 것은?",o:["시나리오 계획수립","실행 과정에서 패턴이 누적되는 창발적 전략","수직적 통합","가격선도협약"],a:1,e:"계획보다 실행 과정에서 점차 형태가 갖춰지는 전략."},
{c:1,q:"전략(strategy)의 어원 'Strategos'의 의미는?",o:["시장 + 거래","군대 + 이끈다","계획 + 실행","자원 + 배분"],a:1,e:"전략은 병법·군사학에 근원을 둡니다."},

{c:1,q:"손빈병법 '전기의 경마' 사례에서 도출한 전략적 사고의 요소가 아닌 것은?",o:["단순하고 구체적인 목표","경쟁환경에 대한 이해","경쟁환경에 대한 객관적 평가","효과적인 수행"],a:2,e:"🪤 메모에 적은 함정 그대로예요. 객관적으로 평가하는 대상은 '경쟁환경'이 아니라 <b>경쟁자와 나의 자원</b>이에요.<br>4요소: 단순·구체적 목표 / 경쟁환경 이해 / 자원에 대한 객관적 평가 / 효과적 수행."},
{c:1,q:"경쟁우위와 지속적 경쟁우위에 대한 설명으로 옳은 것은?",o:["경쟁우위는 기업의 시장점유율이 산업 평균보다 높을 때 갖는 우위다","지속적 경쟁우위는 한 해 동안 산업 평균보다 매우 높은 수익을 낸 것이다","지속적 경쟁우위는 전략을 통해 여러 해에 걸쳐 산업 평균 이상의 수익성을 유지하는 것이다","경쟁우위는 매출액이 경쟁사보다 클 때 갖는 우위다"],a:2,e:"경쟁우위의 기준은 점유율·매출이 아니라 <b>산업 평균 수익성</b>이에요. 지속적 경쟁우위 = '오래 이기는 것', 즉 <b>여러 해에 걸쳐</b> 유지하는 것."},
{c:1,q:"비즈니스모델의 구성요소가 아닌 것은?",o:["고객 선정","제품 정의와 차별화","고객 가치 창출·확보·유지","원가 절감","산업구조 분석"],a:4,e:"🧠 암기: <b>고제고생원활</b> = 고객 선정, 제품 차별화, 고객 가치 창출, 생산성 향상, 원가 절감, 활동 결합.<br>산업구조 분석은 포터의 외부환경 분석 도구예요."},
{c:1,q:"비즈니스모델의 정의로 가장 옳은 것은?",o:["회사의 부서와 보고 체계를 그린 조직도","여러 전략을 조화롭게 실행해 경쟁우위를 유지하고 높은 수익성과 이익증가율을 내게 하는 경영자의 구상","5 Forces 분석으로 도출한 산업의 매력도","주주에게 배당을 결정하는 절차"],a:1,e:"키워드는 '여러 전략의 조화', '경쟁우위 유지', '수익성·이익증가율', 그리고 경영자의 <b>구상</b>이에요."},
{c:1,q:"경영전략의 공통분모 중 '조직'에 대한 설명으로 옳지 않은 것은?",o:["비영리조직도 전략을 가질 수 있다","기업 전체뿐 아니라 사업부와 기능부서도 각자 전략을 가진다","전략은 이윤을 추구하는 영리기업에만 적용되는 개념이다","공공보육 이용률 향상 같은 공공 목표도 전략의 목표가 될 수 있다"],a:2,e:"🪤 메모에서 '문제 내기 좋다'고 한 포인트예요. 영리·비영리 <b>둘 다</b> 전략을 가질 수 있고, 맨 위(기업 전체)뿐 아니라 <b>기능부서까지</b> 각자 전략이 있어요."},
{c:1,q:"한 플랫폼 기업이 정부를 설득해 규제를 풀어 아예 새로운 시장 자체를 열었다. 전략의 '경로' 중 무엇에 해당하는가?",o:["시장 경로","비시장 경로","기능별 전략","전술"],a:1,e:"시장 = 시장 <b>안에서</b> 고객·경쟁사와 어떻게 싸울까 / 비시장 = 시장 <b>밖</b>의 정부·규제·여론을 상대로 판 자체를 열고 <b>어떻게 진출</b>할까."},
{c:1,q:"전략 경로의 '시장'과 '비시장'에 대한 설명으로 옳은 것은?",o:["예전에는 비시장 차원에 머물렀지만 지금은 시장 차원으로 좁혀졌다","시장 경로가 비시장 경로보다 더 넓은 차원이다","예전에는 시장 안에서 어떻게 싸울지에 머물렀다면, 지금은 시장에 어떻게 들어갈지 같은 비시장 차원까지 넓어졌다","비시장 경로는 경쟁사와 가격으로 싸우는 방법을 뜻한다"],a:2,e:"🪤 메모: '비시장이 더 넓은 차원!' 경로는 시장 → 비시장까지 <b>넓어진</b> 거예요."},
{c:1,q:"전략의 HOW를 떠받치는 두 기둥과 관련 이론을 바르게 짝지은 것은?",o:["외부환경(포지셔닝) – 바니의 자원기반이론 / 내부환경 – 포터의 5 Forces","외부환경(포지셔닝) – 포터의 5 Forces / 내부환경 – 바니의 자원기반이론","외부환경 – BCG 매트릭스 / 내부환경 – 앤소프 매트릭스","외부환경 – 가치사슬 / 내부환경 – PESTEL"],a:1,e:"포터는 외부환경을 산업구조(5 Forces)로 분석 → 포지셔닝. 바니는 자원·역량이 전략의 기반 → 내부환경.<br>🪤 두 기둥은 WHAT이 아니라 <b>HOW</b>(어떻게 실행할 건데?)를 떠받친다는 것도 주의."},
{c:1,q:"민츠버그 5P 중 전략의 HOW에 속하지만, '외부환경·내부환경'이라는 두 기둥으로는 설명되지 않는 것은?",o:["계획","패턴","포지션","관점","책략"],a:4,e:"🧠 계패포관책: 계획·패턴 = WHAT, 포지션·관점·책략 = HOW.<br>포지션 = 외부 기둥, 관점 = 내부 기둥으로 설명되고, 남는 <b>책략</b>은 기둥은 아니지만 HOW에 속해요."},
{c:1,q:"'내부 요인을 바탕으로 위치를 찾고, 조직의 비전을 실현하려는 노력'은 민츠버그 5P 중 무엇인가?",o:["계획","패턴","포지션","관점","책략"],a:3,e:"🪤 메모에서 '위치라는 단어 때문에 포지션으로 착각할 것 같다'고 한 바로 그 함정이에요. '<b>내부 요인</b>'과 '<b>비전 실현</b>'이 보이면 관점이에요.<br>포지션은 '<b>외부</b> 환경을 측정해서' 위치를 찾는 것."},
{c:1,q:"삼양식품이 외부 시장을 분석해 '매운 볶음면'이라는 독자적이고 가치 있는 자리를 차지했다. 5P 중 무엇에 가장 가까운가?",o:["패턴","포지션","관점","책략"],a:1,e:"포지션 = 외부 환경을 측정해 시장에서 독자적·가치 있는 위치를 찾는 것 → 외부환경을 산업구조로 분석한 포터와 연결돼요."},
{c:1,q:"계획과 패턴에 대한 설명으로 옳지 않은 것은?",o:["계획은 미래 예측을 바탕으로 한 행동 방침이다","패턴은 과거 행동과 그 분석에서 나온 체계다","계획과 별개로 창발적 행동이 발생할 수 있다","계획은 과거 행동을 분석한 체계이고, 패턴은 미래 예측을 바탕으로 한다"],a:3,e:"🧠 메모의 연상법: 패턴이 '<b>과거</b>'니까 바로 위의 계획은 '<b>미래</b>'. ④는 둘을 뒤바꾼 보기예요."},
{c:1,q:"한 축구 감독이 경기 중 4-4-1-1 포메이션이 계속 잘 통하자, 다음 경기부터 아예 정식 전술로 쓰기 시작했다. 5P 중 무엇인가?",o:["계획","패턴","포지션","책략"],a:1,e:"과거 행동(경기 중 통한 방식)과 그 분석에서 나온 체계 = 패턴."},
{c:1,q:"다음 중 책략(Ploy)의 예로 보기 어려운 것은?",o:["휴리스틱(경험·직감에 의한 결정)","게임이론(서로의 수 읽기)","과점 시장에서의 수읽기","리얼옵션(여러 대안에 조금씩 분산 투자)","5 Forces를 이용한 산업구조 분석"],a:4,e:"메모: '이 4개가 싹 다 책략, 5지선다로 내기 좋을 듯'. 5 Forces는 외부 분석 = 포지션 쪽이고, 책략은 외부·내부 분석으로 나오지 않는 행동이에요."},
{c:1,q:"한 식품회사가 신제품 맛 3가지를 소량으로 먼저 출시해 보고, 반응이 좋은 맛만 대량 생산으로 키웠다. 책략의 예 중 무엇인가?",o:["휴리스틱","게임이론","과점 시장의 수읽기","리얼옵션"],a:3,e:"여러 대안에 <b>조금씩 나눠 투자</b>한 뒤 좋은 쪽을 키우는 것 = 리얼옵션."},
{c:1,q:"LG전자는 공식 합의 없이 삼성전자가 TV 가격을 올리면 따라 올리고, 내리면 따라 내린다. 책략의 예 중 무엇에 가장 가까운가?",o:["휴리스틱","리얼옵션","과점 시장의 수읽기","공유경제"],a:2,e:"분석보다 상대의 움직임을 보고 암묵적으로 비슷하게 움직이는 것. 공식 합의를 하면 담합이라 처벌받으니까 암묵적으로 움직여요.<br>참고: 담합을 적발하는 곳은 공정거래위원회예요."},
{c:1,q:"경영자가 논리나 이론보다 오랜 경험과 직감으로 신속하게 결정했다. 책략의 예 중 무엇인가?",o:["휴리스틱","게임이론","리얼옵션","시나리오 계획"],a:0,e:"휴리스틱 = 경험·직감 기반 결정. (시나리오 계획은 책략이 아니라 계획의 한계를 보완하는 방법)"},
{c:1,q:"이건희 회장이 자동차를 좋아해 삼성이 자동차 사업에 진출한 측면이 있다는 설명은 5P 중 무엇과 관련 있는가?",o:["포지션","관점","책략","패턴"],a:2,e:"'<b>개인의 선호</b>'나 개인의 영향력도 전략 행동으로 이어질 수 있다 = 책략. 바깥(외부)도 안(내부)도 아닌 행동이에요."},
{c:1,q:"책략에 대한 설명으로 옳지 않은 것은?",o:["비시장 요인을 활용하는 시도를 포함한다","경쟁자의 허를 찌르는 시도다","개인의 선호나 영향력도 전략 행동으로 이어질 수 있다","외부환경과 내부환경을 철저히 분석해야 도출된다"],a:3,e:"🪤 책략은 '외부·내부 분석으로 <b>나오지 않는</b> 행동'이에요. ④는 정반대."},
{c:1,q:"스타트업의 '창발적 프로세스'에 대한 설명으로 옳지 않은 것은?",o:["시대가 빠르게 변해 장기 계획의 의미가 작다","빠르고 민첩하게 대응하면서 패턴(과거 데이터)을 확보한다","비즈니스모델을 정하고 실행하면서 바꿔 나간다","산업구조와 조직구조를 깊이 분석하는 것이 선행되어야 한다"],a:3,e:"🪤 메모에 '이런 선지 나오면 오답으로 제껴야 함'이라고 적은 그 보기예요. 창발적 프로세스는 산업·조직구조를 깊이 분석하기보다 <b>비즈니스모델</b>을 정하고 부딪히며 바꿔 가요."},
{c:1,q:"5P에서 '계획(미래)'과 '패턴(과거)' 사이에 존재하는 것은?",o:["포지션","창발적 전략(창발적 프로세스)","BCG 매트릭스","가격선도협약"],a:1,e:"미래 예측(계획)과 과거 데이터(패턴) 사이에서, 실행하면서 형태가 갖춰지는 것 = 창발적 전략."},
{c:1,q:"온라인 쇼핑몰이 상품 상세페이지를 A안·B안으로 만들어 반응이 좋은 쪽을 채택하는 일을 반복하며 방식이 쌓여 갔다. 이 사례가 설명하는 것은?",o:["시나리오 계획수립","실행 과정에서 패턴이 쌓이는 창발적 프로세스","분산된 계획수립","장기전략계획"],a:1,e:"🪤 메모: A/B테스트와 시나리오 계획을 헷갈리지 말 것. A/B테스트 = 스타트업(창발적 프로세스) 설명 / 시나리오 계획 = 계획의 한계를 보완하는 방법(플랜 A·B·C)."},
{c:1,q:"로열더치쉘처럼 여러 미래 상황을 가정해 플랜 A·B·C를 세우고 각 상황의 단서를 정해 두는 방식은?",o:["A/B 테스트","시나리오 계획수립","리얼옵션","창발적 프로세스"],a:1,e:"시나리오 계획수립 = 예측하기 어려운 현실에서 '계획의 한계'를 보완하는 방법. A/B 테스트(스타트업)와 범주가 달라요."},
{c:1,q:"마켓컬리는 거창한 중장기 계획 없이 '출근 전에 식료품을 받고 싶다'는 고객 욕구와 '새벽엔 도로가 비어 물류비가 싸다'는 아이디어로 시작해 부딪히며 사업을 키웠다. 가장 관련 있는 개념은?",o:["창발적 프로세스","장기전략계획","Top-down 계획수립","BCG 매트릭스"],a:0,e:"비즈니스모델을 정하고 실행하며 바꿔 가는 스타트업식 창발적 프로세스예요."},
{c:1,q:"'계획보다 실행 과정에서 형태가 갖춰지고, 현장의 방법이 쌓여 조직의 행동 양식이 된다'는 무엇에 대한 한 줄 정리인가?",o:["의도된 전략","창발적 전략","기능별 전략","전술"],a:1,e:"메모: '조직!! 행동의!! 양식!!이 되는 게 창발적 전략'."},
{c:1,q:"경영학이 '전략'이라는 군사 용어를 빌려 온 이유로 가장 적절한 것은?",o:["기업이 군대처럼 상명하복 문화를 가져야 했기 때문","기업이 커지며 많은 사람과 자원을 다룰 사례가 정부·군대밖에 없었고, 상대를 이긴다는 이미지는 군대가 더 강했기 때문","정부가 군사 용어 사용을 의무화했기 때문","전쟁 중에 경영학이 처음 생겼기 때문"],a:1,e:"어원 Strategos = 군대 + 이끈다. 경쟁사를 '이긴다'는 이미지 때문에 군대에서 가져왔어요."},
{c:1,q:"다음 중 '전술'에 가장 가까운 것은?",o:["새로운 사업 영역으로 진출할지 결정한다","원가우위로 경쟁할지 차별화로 경쟁할지 정한다","재무팀이 이번 분기 이자 부담을 줄이려고 단기 차입금을 상환한다","해외 기업을 인수한다"],a:2,e:"🪤 예시문제 1번 유형. 전술 = <b>특정 기능분야(재무·마케팅 등) 또는 특정 시장</b>에서 성과를 높이는 것. 회사 '전체' 방향이면 전략.<br>①④는 기업전략, ②는 사업전략."},
{c:1,q:"전략과 전술에 대한 설명으로 옳지 않은 것은?",o:["전략은 경쟁우위를 위해 경영자원을 배분하는 전반적인 계획이다","전술은 특정 기능분야나 시장에서 성과를 높이는 것이다","경영전략은 전술에, 기능별 전략은 전략에 가깝다","전략이라는 말은 그리스어 Strategos에서 왔다"],a:2,e:"🪤 거꾸로예요. <b>경영전략 = 전략</b>, <b>기능별 전략 = 전술</b>에 가까워요."},
{c:1,q:"손자병법 도·천·지·장·법 중, 통제할 수 없고 모든 산업에 영향을 주며 PESTEL과 연결되는 것은?",o:["도","천","지","법"],a:1,e:"천(하늘) = <b>외부환경의 변화</b> → PESTEL(모든 산업에 영향).<br>🪤 지(지형) = <b>산업 구조</b> → 5 Forces(내 산업에만 해당). 둘 다 외부라 헷갈리기 쉬워요."},
{c:1,q:"'고액 지출은 팀장 승인을 받아야 집행된다'처럼 일이 흘러가는 규칙과 조직도는 도·천·지·장·법 중 무엇에 해당하는가?",o:["도","지","장","법"],a:3,e:"법 = <b>조직구조</b>(조직도)와 <b>관리 프로세스</b>(일이 흘러가는 규칙·순서)."},
{c:1,q:"손자병법의 '도(道)'를 현대 경영으로 바꾼 것으로 옳은 것은?",o:["비전","미션과 목표","지도자","산업 구조"],a:1,e:"🪤 길 도 = 앞으로 갈 길, 무엇을 해야 하나 → '<b>미션과 목표</b>'. 비전이라고 쓰면 틀려요."},
{c:1,q:"국내에서 팔던 불닭볶음면을 그대로 미국 시장에 수출했다. 앤소프의 성장전략 중 무엇인가?",o:["시장침투","시장개발","제품개발","다각화"],a:1,e:"기존 제품 + 신규 시장 = 시장개발.<br>기존·기존 = 시장침투 / 신규 제품·기존 시장 = 제품개발 / 신규·신규 = 다각화."},
{c:1,q:"한 커피 브랜드가 기존 고객에게 멤버십 할인과 광고를 늘려 기존 메뉴를 더 많이 팔았다. 앤소프의 성장전략 중 무엇인가?",o:["시장침투","시장개발","제품개발","다각화"],a:0,e:"기존 제품 + 기존 시장 = 시장침투."},
{c:1,q:"한 스마트폰 회사가 기존 스마트폰 고객에게 새로 개발한 무선 이어폰을 판매했다. 앤소프의 성장전략 중 무엇인가?",o:["시장침투","시장개발","제품개발","다각화"],a:2,e:"신규 제품 + 기존 시장(같은 고객) = 제품개발."},
{c:1,q:"1950~60년대 미국 기업의 흐름을 인과관계에 맞게 나열한 것은?",o:["다각화 → 사업부 간 자원 배분 문제 → BCG 매트릭스·SWOT 등장","오일쇼크 → 다각화 → BCG 매트릭스 등장","BCG 매트릭스 등장 → 다각화 → 자원 배분 문제","산업구조 분석 → 다각화 → 오일쇼크"],a:0,e:"세계대전 피해가 적고 수요가 늘어 '계획만 잘 세우면 성장' → 다각화 → 사업부가 많아져 한정된 자원을 어디에 줄지 고민 → BCG·SWOT. 기획조정실·컨설턴트도 이때 등장."},
{c:1,q:"1970년대 오일쇼크 이후 경영전략의 변화로 옳지 않은 것은?",o:["장기 계획보다 그때그때의 상황 대응이 중요해졌다","조직원 전체의 전략적 사고방식이 필요해졌다","성장이 둔해져 '경쟁'이 핵심 키워드가 되었다","외부환경 변수가 줄어 장기 계획의 정확도가 높아졌다"],a:3,e:"🪤 거시환경 변수가 <b>생겨서</b> 불확실성이 커졌어요. 메모의 흐름: 1970 오일쇼크 → 상황 대응 · 전 구성원의 전략적 사고 · 경쟁."},
{c:1,q:"포터와 바니를 비교한 것으로 옳지 않은 것은?",o:["포터 – 산업구조분석 – 외부환경","바니 – 자원기반이론 – 내부환경","포터 – 수익성은 산업구조가 결정한다","바니 – SWOT 중 O·T에 해당한다"],a:3,e:"🪤 바니(자원기반이론)는 내부환경이니까 <b>S·W</b>예요. O·T는 포터.<br>참고: 메모 110번째 줄에도 '바니 = OT'로 적혀 있어요. 바로 아래 표에는 S·W로 맞게 적었으니 그 줄만 고쳐 두세요."},
{c:1,q:"포터의 5 Forces를 '힘'의 관계와 '경쟁'의 차원으로 나눌 때, '경쟁'의 세 차원에 속하지 않는 것은?",o:["기존 기업 간 경쟁","잠재적(신규) 진입자의 위협","대체재의 위협","구매자의 교섭력"],a:3,e:"🧠 공구기잠대. 공급자·구매자 = <b>힘</b> / 기존 경쟁·잠재 진입자·대체재 = <b>경쟁</b>의 세 차원."},
{c:1,q:"포터 관점에서 경쟁우위를 얻기 위해 필요한 '포지션'의 두 가지는?",o:["비용우위, 차별화우위","다각화, 수직적 통합","시장침투, 시장개발","미션, 비전"],a:0,e:"포터: 수익성은 산업구조가 결정하고, 경쟁우위를 위해서는 비용우위 또는 차별화우위라는 포지션이 필요하다."},
{c:1,q:"1990년대 바니의 자원기반이론이 등장한 배경으로 가장 적절한 것은?",o:["외부환경 분석만으로는 그 환경에 어떻게 대응할지 구체적인 방향이 나오지 않는다는 비판","오일쇼크로 장기 계획이 불가능해졌기 때문","플랫폼 기업이 등장했기 때문","정부가 산업구조 분석을 금지했기 때문"],a:0,e:"메모의 바니 입장: '진입장벽이 높다는 건 알겠는데 그럼 어떻게 들어가냐?' → 경쟁우위는 <b>경영자원과 핵심역량</b>에 기초한다."},
{c:1,q:"2010년대 인터넷·플랫폼 기업이 주도하면서 나타난 변화로 옳지 않은 것은?",o:["소비자가 리뷰·SNS로 생산에 의견을 내게 되었다","네트워크 경제성 같은 연구 주제가 다양해졌다","공유경제·플랫폼 비즈니스가 연구 주제가 되었다","소비자는 여전히 만들어진 제품을 쓰기만 하는 역할에 머물렀다"],a:3,e:"소비자–생산자 관계가 바뀌었어요(쓰기만 하던 소비자 → 의견을 내는 소비자)."},
{c:1,q:"'내가 가진 것을 안 쓸 때 다른 사람에게 빌려주고 돈을 받는 경제 방식'(예: Uber, Grab, Airbnb)은?",o:["네트워크 경제성","공유경제","디지털 트랜스포메이션","규모의 경제"],a:1,e:"공유경제. 네트워크 효과(사용자가 많을수록 가치↑, 카카오톡)와 구분하세요."},
{c:1,q:"경영전략의 최신 경향 흐름을 순서대로 나열한 것은?",o:["FANG → 플랫폼 → 생성형 AI","플랫폼 → FANG → 생성형 AI","생성형 AI → 플랫폼 → FANG","플랫폼 → 생성형 AI → FANG"],a:1,e:"2000년대 플랫폼 → 2010년대 FANG(페이스북·아마존·넷플릭스·구글) → 2020년대 생성형 AI."},
{c:1,q:"기업수준 경영자의 역할이 아닌 것은?",o:["조직 목표 설정","사업 범위 결정","사업부 간 자원 배분","개별 사업부에서 차별화로 갈지 원가우위로 갈지 결정"],a:3,e:"차별화냐 원가우위냐는 <b>사업수준</b> 경영자(예: LG생활건강 Beauty 사업부장)의 일이에요. 기업수준 = 목표 설정·사업 범위·자원 배분(셋 다 중요!)."},
{c:1,q:"기업수준 경영자에 해당하지 않는 사람은?",o:["CEO","이사","기업수준 스태프","Beauty 사업부의 생산담당 경영자"],a:3,e:"🪤 '담당'이 들어가면 기능수준 경영자예요. 그리고 그냥 스태프가 아니라 '<b>기업수준</b> 스태프'라는 점도 메모 포인트."},
{c:1,q:"'사업단위'에 대한 설명으로 옳지 않은 것은?",o:["특정 시장에 제품·서비스를 공급한다","독자적으로 운영되는 사업부다","재무·구매·생산·마케팅 같은 기능을 스스로 갖고 있다","재무·생산 기능은 본사에 맡기고 판매 기능만 독자적으로 가진다"],a:3,e:"🧠 '독사' = <b>독</b>자적으로 운영되는 <b>사</b>업부. 사업부 안에 기능부서가 다 들어 있어요."},
{c:1,q:"O/X: 기능수준 경영자는 위에서 내려온 지시를 수행할 뿐, 상위 경영자에게 정보를 제공하지는 않는다.",o:["O","X"],a:1,e:"X. 메모에 적어둔 O/X 그대로예요. 기능수준 경영자는 상위 경영자에게 <b>정보를 제공</b>해요 → 나중에 '분산된 계획수립'과 연결."},
{c:1,q:"다음 중 기업전략(기업수준 전략)이 아닌 것은?",o:["다각화","수직적 통합","인수합병(M&A)","기존 사업 철수","차별화"],a:4,e:"🧠 <b>다수인해철</b>(다각화·수직적 통합·인수합병·해외 진출·철수) = 기업전략 / <b>비차집</b>(비용우위·차별화·집중화) = 사업전략."},
{c:1,q:"전략 수준 구분 요령에 따를 때 '어떻게 이겨먹을까?'에 해당하는 것은?",o:["새 사업에 진출한다","다른 회사를 인수한다","원가를 낮춰 경쟁한다","마케팅팀이 SNS 광고 일정을 짠다"],a:2,e:"어디서 싸울까 = 기업전략 / <b>어떻게 이길까 = 사업전략</b> / 각 부서가 뭘 할까 = 기능별 전략."},
{c:1,q:"전략적 계획수립 과정 그림(22슬라이드)의 '전략 선택'에 새로 추가된 것으로, 어느 나라에 진출하고 여러 나라에서 어떻게 경쟁할지 정하는 전략은?",o:["기능수준 전략","사업수준 전략","글로벌 수준 전략","기업수준 전략"],a:2,e:"🧠 <b>기사글기</b> = 기능·사업·글로벌·기업수준. 이 중 글로벌 수준이 새로 추가된 것."},
{c:1,q:"전략적 계획수립 과정 그림에서 전략 실행이 법적·윤리적으로 어긋나지 않도록 계속 감시하는 요소는?",o:["거버넌스와 윤리","조직문화 설계","외부환경 분석","SWOT 전략 선택"],a:0,e:"[전략 실행] 맨 위의 거버넌스·윤리가 감시하고, 그 아래 조직구조·조직문화·통제시스템 설계로 전략이 작동해요."},
{c:1,q:"전략적 계획수립 과정 그림의 [전략 실행]에 포함되지 않는 것은?",o:["조직구조 설계","조직문화 설계","조직 통제시스템 설계","산업구조 분석"],a:3,e:"산업구조 분석은 [전략 수립]의 외부환경 분석이에요. 핵심 메시지: 전략은 세우는 것만으로 끝이 아니라 <b>조직의 구조·문화·통제</b>가 맞물려야 한다."},
{c:1,q:"전략적 계획수립 과정 그림에서 [전략 수립]의 출발점이 되는 것은?",o:["현재의 비즈니스모델, 그리고 미션·비전·가치·목표","조직 통제시스템","거버넌스와 윤리","재무제표"],a:0,e:"🧠 미비가목. 이 둘을 출발점으로 외부·내부환경 분석을 돌리고 합쳐 SWOT 전략을 선택해요."},
{c:1,q:"전략적 계획수립 5단계 중 '외부 경쟁 환경 분석'과 '내부 운영 환경 분석'에서 파악하는 것을 바르게 짝지은 것은?",o:["외부 – 강점·약점 / 내부 – 기회·위협","외부 – 기회·위협 / 내부 – 강점·약점","외부 – 미션 / 내부 – 비전","외부 – 강점·기회 / 내부 – 약점·위협"],a:1,e:"🧠 미외내선실: 미션·목표 → <b>외부(O·T)</b> → <b>내부(S·W)</b> → 전략 선정 → 실행."},
{c:1,q:"전략적 계획수립 5단계 중 '전략 선정' 단계에서 특히 강조되는 것은?",o:["미션·주요 목표와의 일관성","경쟁사 가격과의 일치","CEO의 개인 선호","가장 많은 사업부 참여"],a:0,e:"④ 미션·주요 목표와 <b>일관성</b> 있게 전략을 선정."},
{c:1,q:"O/X: 전략적 계획수립은 5단계를 한 번 거치면 끝난다.",o:["O","X"],a:1,e:"X. 실제 성과가 다음 계획의 토대가 되는 <b>피드백 루프</b>로 계속 돌아요."},
{c:1,q:"주주가치를 구성하는 두 가지는?",o:["매출액, 영업이익","주가 상승, 배당금","시장점유율, 브랜드 가치","부채비율, 자기자본"],a:1,e:"주주가치 = 주가 상승 + 배당금. 교수님이 넘어간 부분이라 '주주가치를 높이는 것이 전략의 목표가 될 수 있다' 정도만 알면 돼요."},
/* ---------- 3장 ---------- */
{c:3,q:"3장과 4장의 분석 대상을 바르게 짝지은 것은?",o:["3장 – 강점·약점 / 4장 – 기회·위협","3장 – 기회·위협 / 4장 – 강점·약점","3장 – 미션 / 4장 – 비전","3장 – 자원 / 4장 – 산업구조"],a:1,e:"3장 외부환경 = 기회(O)·위협(T) / 4장 내부환경 = 강점(S)·약점(W)."},
{c:3,q:"O/X: 산업의 경계는 생산 기술을 기준으로 한 번 정해지면 바뀌지 않는다.",o:["O","X"],a:1,e:"X. 산업의 경계는 <b>기본 고객니즈</b>로 정해지고, 바뀔 수 있어요(스타필드: '우리의 경쟁사는 야구장')."},
{c:3,q:"포터의 5 Forces에 해당하지 않는 것은?",o:["공급자의 교섭력","구매자의 교섭력","기존 기업 간 경쟁","잠재적 진입자의 위협","보완재"],a:4,e:"🧠 공구기잠대 = 공급자·구매자·기존 경쟁·잠재 진입자·대체재. 보완재는 포터가 <b>간과한</b> 요소예요."},
{c:3,q:"진입장벽을 높이는 요인이 아닌 것은?",o:["규모의 경제","브랜드 충성도","절대원가우위","고객의 교체비용","퇴출장벽"],a:4,e:"🪤 '장벽'이라는 단어가 같아서 헷갈리는 보기. 퇴출장벽은 <b>기존 기업 간 경쟁 강도</b>를 높이는 요인이에요.<br>진입장벽: 규모의 경제, 브랜드 충성도, 절대원가우위, 고객 교체비용, 정부 규제."},
{c:3,q:"O/X: 산업이 매력적이기만 하면 잠재 경쟁자는 반드시 진입한다.",o:["O","X"],a:1,e:"X. 진입 위험 = 산업의 <b>매력성</b> + <b>진입장벽의 높이</b>. 매력적이어도 장벽이 높으면 못 들어와요."},
{c:3,q:"기존 기업 간 경쟁 강도에 영향을 주는 요인이 아닌 것은?",o:["산업의 경쟁구조(통합 vs 파편화)","수요 여건","원가 여건(고정비)","퇴출장벽","고객의 교체비용"],a:4,e:"🪤 고객의 교체비용은 <b>진입장벽</b> 요인. 경쟁 강도 4요인 = 경쟁구조·수요 여건·원가 여건·퇴출장벽."},
{c:3,q:"기존 기업 간 경쟁 강도에 대한 설명으로 옳은 것은?",o:["산업 수요가 증가하면 경쟁이 심해진다","고정비가 높은 산업에서 수요가 줄면 가격 인하 경쟁이 생기기 쉽다","퇴출장벽이 높을수록 경쟁이 완화된다","파편화 산업은 진입장벽이 높다"],a:1,e:"수요 증가 → 경쟁 완화 / 수요 감소 + 높은 고정비 → 가격 경쟁 / 퇴출장벽↑ → 못 떠나니 경쟁↑ / 파편화 → 진입장벽 낮음."},
{c:3,q:"통합된 산업과 파편화된 산업에 대한 설명으로 옳지 않은 것은?",o:["통합된 산업은 소수 대기업이 서로 상호의존적이다","파편화된 산업은 진입장벽이 낮고 차별화가 어렵다","통합된 산업은 다수 중소기업으로 구성되고 진입장벽이 낮다","동네 세탁소는 파편화된 산업의 예다"],a:2,e:"🪤 ③은 파편화 산업의 설명을 통합 산업에 붙인 보기예요."},
{c:3,q:"구매자의 교섭력이 높아지는 상황이 아닌 것은?",o:["공급업체가 많고 구매자가 소수일 때","구매자가 대량으로 구매할 때","구매자가 직접 생산(후방통합)하겠다고 위협할 수 있을 때","구매자의 공급업체 교체비용이 매우 높을 때"],a:3,e:"💡 교수님 말대로 '<b>누가 더 의존하나</b>'로 보면 쉬워요. 교체비용이 높으면 구매자가 공급자에게 묶여서(의존) 구매자의 힘이 <b>약해져요</b>."},
{c:3,q:"전방통합과 후방통합을 교섭력과 바르게 짝지은 것은?",o:["공급자의 전방통합 위협 → 구매자 교섭력↑","구매자의 후방통합 위협 → 구매자 교섭력↑","구매자의 전방통합 위협 → 공급자 교섭력↑","공급자의 후방통합 위협 → 공급자 교섭력↓"],a:1,e:"🪤 예시문제 9번 함정. 구매자가 직접 만들겠다(<b>후방</b>통합) → 구매자 힘↑ / 공급자가 직접 팔겠다(<b>전방</b>통합) → 공급자 힘↑."},
{c:3,q:"커피 전문점 산업 입장에서 '에너지드링크'와 '디저트'를 바르게 분류한 것은?",o:["에너지드링크 – 보완재 / 디저트 – 대체재","에너지드링크 – 대체재 / 디저트 – 보완재","둘 다 대체재","둘 다 보완재"],a:1,e:"같은 기본 니즈(각성)를 채우는 다른 제품 = 대체재 / 함께 쓰면 가치가 커지는 제품 = 보완재."},
{c:3,q:"보완재에 대한 설명으로 옳지 않은 것은?",o:["보완재가 많아지고 좋아질수록 산업 수요와 수익이 증가한다","포터의 5 Forces 모델에 처음부터 포함된 요소다","PC와 소프트웨어, 전기차와 충전소가 예다","대체재와 보완재 모두 산업 수요에 영향을 준다"],a:1,e:"🪤 보완재는 포터가 <b>간과한</b> 요소예요(그래서 5 Forces + 보완재로 따로 설명)."},
{c:3,q:"전략집단과 이동장벽에 대한 설명으로 옳지 않은 것은?",o:["전략집단은 같은 산업 안에서 전략적 성격이 비슷한 기업들의 묶음이다","같은 전략집단의 제품은 고객이 서로 대체재로 받아들이는 경향이 있다","이동장벽은 전략집단 간 이동을 방해하는 요인이다","이동장벽에는 진입장벽과 퇴출장벽이 포함되지 않는다"],a:3,e:"🪤 이동장벽은 진입장벽·퇴출장벽을 <b>포함</b>해요."},
{c:3,q:"산업수명주기의 단계를 순서대로 나열한 것은?",o:["도입기 → 성장기 → 성숙기 → 조정기 → 쇠퇴기","도입기 → 성장기 → 조정기 → 성숙기 → 쇠퇴기","도입기 → 조정기 → 성장기 → 성숙기 → 쇠퇴기","성장기 → 도입기 → 조정기 → 성숙기 → 쇠퇴기"],a:1,e:"🪤 조정기(Shake out)가 성숙기 <b>앞</b>이에요. 조정기에 약한 기업이 정리된 뒤 소수만 남은 상태가 성숙기."},
{c:3,q:"성장 둔화로 수요가 대체수요에 한정되기 시작하고, 초과공급으로 가격이 내려가며 약한 기업이 퇴출되는 단계는?",o:["성장기","조정기","성숙기","쇠퇴기"],a:1,e:"조정기. 남의 고객을 뺏어와야 성장하는 단계예요."},
{c:3,q:"산업수명주기 '성숙기'의 특징으로 옳은 것은?",o:["진입장벽이 가장 낮다","진입장벽이 높고 소수 기업이 가격선도협약 등으로 가격전쟁을 피하려 한다","수요가 폭발적으로 증가한다","고객 교육과 유통망 구축이 핵심이다"],a:1,e:"①③은 성장기, ④는 도입기의 특징."},
{c:3,q:"산업분석 모형(5 Forces 등)의 한계로 강의안에 제시되지 않은 것은?",o:["수명주기는 일반화된 모형일 뿐이다","정적인 모형이라 혁신에 따른 빠른 변화를 반영하기 어렵다","산업구조의 영향을 과장하고 기업 간 차이를 과소평가한다","거시환경 변수를 지나치게 강조한다"],a:3,e:"한계 3가지: ① 수명주기 이슈 ② 혁신과 변화(단속균형) ③ 기업 차이(루멜트 약 10%)."},
{c:3,q:"'안정된 산업구조가 혁신에 의해 급속히 깨지고, 시간이 지나 다시 재편되는 것'은?",o:["단속균형","가격선도협약","규모의 경제","이동장벽"],a:0,e:"5 Forces가 정적인 모형이라는 한계와 연결돼요."},
{c:3,q:"루멜트의 연구(산업구조의 설명력 약 10%)가 시사하는 것은?",o:["산업구조가 기업 성과의 대부분을 결정한다","기업 간 수익률 차이는 개별 기업의 자원과 역량에서 더 많이 나온다","거시환경이 가장 중요하다","전략집단은 의미가 없다"],a:1,e:"→ 그래서 4장 내부환경 분석(자원·역량)으로 이어져요. 1장의 '포터 vs 바니'와 같은 흐름."},
{c:3,q:"PESTEL 요인을 바르게 짝지은 것이 아닌 것은?",o:["원화 약세 – 경제적 요인","65세 이상 인구 비중 증가 – 인구통계적 요인","건강 관심 증가로 제로칼로리 음료 확산 – 인구통계적 요인","항공산업 규제 완화 – 정치·법적 요인"],a:2,e:"🪤 건강 관심 증가는 사회 관습·가치의 변화라 <b>사회적</b> 요인이에요. 인구통계 = 나이·성별·민족·인종·사회계층."},
{c:3,q:"거시경제 환경의 4요소가 아닌 것은?",o:["경제 성장률","이자율","환율","인플레이션율","시장점유율"],a:4,e:"성장률·이자율·환율·인플레이션율. 시장점유율은 기업 단위 지표예요."},
{c:3,q:"부채의 실질가치를 높여 부채가 많은 개인과 기업에 부담을 주는 현상은?",o:["인플레이션","디플레이션","환율 상승","이자율 하락"],a:1,e:"🪤 인플레이션은 미래 예측을 어렵게 해서 투자 기피를 낳고, <b>디플레이션</b>이 부채 실질가치를 높여요."},
{c:3,q:"교수님이 5 Forces를 다룬 뒤 거시환경(PESTEL)도 알아야 한다고 한 이유는?",o:["5 Forces는 정적인 모형이고, 거시환경이 5 Forces의 각 경쟁 요소에 영향을 주기 때문","거시환경이 내부 자원을 결정하기 때문","5 Forces가 거시환경을 이미 포함하기 때문","거시환경은 한 기업에만 영향을 주기 때문"],a:0,e:"10/15 수업: 정치·경제 같은 외부 거시환경이 5 Forces에 영향을 미치니 이것도 이해해야 한다."},
{c:3,q:"소포택배업체가 수익이 낮아도 전국 연계망을 유지해야 해서 쉽게 떠나지 못한다. 어떤 퇴출장벽인가?",o:["감정적 애착","경제적 의존","최소한의 값비싼 자산 유지 필요성","퇴직수당·연금 같은 고정비용"],a:2,e:"퇴출장벽 5가지: 특수 설비 / 퇴직수당·연금 / 감정적 애착 / 경제적 의존 / 최소한의 값비싼 자산 유지."},
{c:3,q:"3장에서 정의한 '위협'으로 옳은 것은?",o:["기업 내부의 약점","비즈니스와 수익성에 악영향을 주거나 위험에 빠뜨리는 외부 요소","경쟁사의 강점","전략 실행의 실패"],a:1,e:"🪤 '약점'은 내부(4장)예요. 위협은 <b>외부</b> 요소."},
/* ---------- 4장 ---------- */
{c:4,q:"'독보적 역량'의 정의로 옳은 것은?",o:["기업이 보유한 토지와 설비의 총량","경쟁사와 구별되게 하거나 상당히 낮은 비용으로 생산하게 하는 기업별 강점","산업 평균 수익성","정부가 인정한 특허의 수"],a:1,e:"독보적 역량은 하나 이상의 자원에 토대를 둬요(예: 토요타 린 생산 = 프로세스 지식 + 조직 문화 + 설비)."},
{c:4,q:"고급 생산요소에 해당하지 않는 것은?",o:["프로세스 지식","조직 구조(설계)","지적 재산","시설과 장비"],a:3,e:"기본 생산요소 = 토지·노동·경영·시설·장비 / 고급 = 프로세스 지식·조직 구조·지적 재산."},
{c:4,q:"VRIO에서 'O'가 뜻하는 것은?",o:["Opportunity(기회)","Organization(조직)","Originality(독창성)","Operation(운영 효율)"],a:1,e:"🪤 SWOT의 O(기회)와 헷갈리게 만든 보기. VRIO = 가치·희귀성·모방 불가능성·<b>조직</b>. (I도 Innovation이 아니라 Inimitability)"},
{c:4,q:"O/X: VRIO의 희귀성(R)은 경쟁자와 상관없이 정해지는 절대적인 기준이다.",o:["O","X"],a:1,e:"X. 희귀성은 경쟁자 대비 <b>상대 개념</b>이에요(K-뷰티 순위 역전 사례)."},
{c:4,q:"고급 생산요소가 기본 생산요소보다 모방 장벽을 더 많이 만드는 이유로 옳지 않은 것은?",o:["시간과 경험을 통해 축적된다","암묵적이라 식별하기 어렵다","조직 고유의 문화 안에서 형성된다","문서화되어 있어 외부로 쉽게 이전된다"],a:3,e:"🪤 문서화되어 쉽게 이전되면 오히려 모방이 쉬워요. 프로세스 지식은 <b>암묵적</b>이고 조직 문화로 전달돼요."},
{c:4,q:"가치(V)·가격(P)·비용(C)의 관계를 잘못 짝지은 것은?",o:["V − P = 소비자잉여","P − C = 이윤","V − C = 창출된 가치","V − C = 이윤"],a:3,e:"🪤 V−C는 기업과 소비자가 나눠 갖는 '창출된 가치' 전체이고, 그중 기업 몫이 P−C(이윤)이에요."},
{c:4,q:"차별화로 가치가 올라간 기업의 '옵션 2'를 바르게 설명한 것은?",o:["가치 상승분 이상으로 가격을 올려 이윤을 키운다","가격은 조금만 올리거나 유지해 수요를 늘리고, 규모의 경제로 원가를 낮춰 장기적으로 이윤을 키운다","가격을 원가 아래로 내려 경쟁사를 퇴출시킨다","가치를 낮추고 가격을 유지한다"],a:1,e:"①은 옵션 1. 옵션 2는 처음엔 마진이 작지만 수요↑ → 규모의 경제 → 원가↓ → 이윤↑(스타벅스, 애플). 수요가 안 늘면 실현 불가."},
{c:4,q:"4장 수익성 슬라이드에서 교수님이 결국 하고 싶었던 말은?",o:["경쟁우위와 수익성 결정을 위해서는 가치·가격·비용 사이의 동적 관계를 이해해야 한다","가격은 항상 가치와 같아야 한다","비용만 낮추면 수익성은 자동으로 오른다","수요는 가격과 무관하다"],a:0,e:"동영상 강의 요지: 가치·가격·비용의 <b>동적 관계</b> + 수요와 생산량 수준별 비용 구조를 이해해야 한다."},
{c:4,q:"가치사슬의 지원활동이 아닌 것은?",o:["연구개발","조달(물류관리)","인적자원","정보시스템","마케팅·영업"],a:4,e:"마케팅·영업은 <b>주활동</b>(생산·마케팅영업·고객 서비스). 지원활동 = R&D·조달·인적자원·정보시스템·기업 기반구조."},
{c:4,q:"가치사슬에 대한 설명으로 옳지 않은 것은?",o:["투입물을 고객 가치가 있는 산출물로 바꾸는 연쇄적인 활동이다","주활동(본원적 활동)과 지원활동으로 나뉜다","이 단계를 거치며 차별화와 비용 구조가 결정된다","외부환경의 기회와 위협을 찾기 위한 도구다"],a:3,e:"🪤 가치사슬은 <b>내부</b> 분석 도구예요. 어떤 활동이 가치를 만들고 못 만드는지 → 강점·약점 파악."},
{c:4,q:"경쟁우위의 4가지 구성요소가 아닌 것은?",o:["효율성","품질","혁신","고객 대응성","시장점유율"],a:4,e:"효율성·품질·혁신·고객 대응성. 이 4가지가 맞물려 저원가·차별화를 만들어요."},
{c:4,q:"효율성과 효과성에 대한 설명으로 옳은 것은?",o:["효율성은 목표를 얼마나 달성했는지, 효과성은 인풋 대비 아웃풋이다","효율성은 인풋 대비 아웃풋, 효과성은 목표를 얼마나 달성했는지다","둘은 같은 개념이다","효과성은 비용 절감액만을 뜻한다"],a:1,e:"🪤 뒤바꾼 보기(①) 조심. 효율성 = Output/Input, 효과성 = 목표 달성 정도."},
{c:4,q:"품질의 두 차원과 경쟁우위 기여 방향을 바르게 짝지은 것은?",o:["우수성 – 낮은 비용 / 신뢰성 – 차별화","우수성 – 차별화 / 신뢰성 – 생산성↑·원가↓","둘 다 원가 상승","둘 다 시장 세분화"],a:1,e:"우수성(디자인·기능) → 차별화 / 신뢰성(일관된 성능, 적은 고장) → 생산성↑·원가↓ (+차별화)."},
{c:4,q:"토요타의 린 생산방식은 혁신의 두 종류 중 무엇인가?",o:["제품 혁신","공정 혁신","마케팅 혁신","조직 혁신"],a:1,e:"공정 혁신 = 새 생산공정 또는 고객 전달 프로세스 개발. 제품 혁신 = 새 제품, 더 탁월한 속성."},
{c:4,q:"고객 대응성의 구성요소가 아닌 것은?",o:["개별 맞춤 제품","고객 대응시간 단축","탁월한 A/S와 고객지원","원재료 대량구매로 단가 인하"],a:3,e:"대량구매 할인은 규모의 경제(효율성·비용) 쪽이에요."},
{c:4,q:"수익성 지표와 분모를 바르게 짝지은 것은?",o:["ROA – 자기자본","ROE – 총자산","ROIC – 투하자본","ROE – 투하자본"],a:2,e:"ROA = 순이익/<b>총자산</b>, ROE = 순이익/<b>자기자본</b>, ROIC = 영업 세후이익/<b>투하자본</b>. 계산 문제는 안 나와요."},
{c:4,q:"10/15 수업 기준, 경쟁우위의 4가지 구성요소와 저원가·차별화의 관계로 옳은 것은?",o:["4가지 구성요소는 저원가·차별화를 구체적으로 만들어 내는 요소로 서로 맞물려야 한다","4가지 구성요소는 기업수준 전략에만 쓰인다","저원가와 차별화는 4가지 구성요소와 무관하다","4가지 중 하나만 갖추면 충분하다"],a:0,e:"큰 방향은 저원가·차별화, 그걸 만드는 세부 요소가 효율성·품질·혁신·고객 대응성."},
{c:4,q:"VRIO에서 가치(V) 있는 자원의 의미로 옳은 것은?",o:["강력한 수요 창출이나 비용 절감을 유발하는 자원","장부가치가 높은 자원","오래 보유한 자원","경쟁사도 쉽게 구할 수 있는 자원"],a:0,e:"외부 기회를 활용하고 위협에 대처하게 해 주는 자원 = 수요 창출·비용 절감 유발."},
/* ---------- 5장 ---------- */
{c:5,q:"사업수준 전략의 정의로 옳은 것은?",o:["기업 전체가 어떤 사업 영역에 참여할지 결정하는 것","사업부가 추구하는 전반적인 경쟁 테마로, 특정 시장에서 경쟁우위를 얻기 위해 자신을 포지셔닝하는 방식","특정 기능부서의 단기 성과 개선","주주가치를 높이는 배당 정책"],a:1,e:"🪤 ①은 기업전략. 사업수준 = '어떻게 이길까'(1장 구분 요령과 연결)."},
{c:5,q:"O/X: 효율화 곡선 위에 있기만 하면 곡선 위의 모든 위치는 똑같이 매력적이다.",o:["O","X"],a:1,e:"X. 그 위치의 <b>수요</b>가 얼마나 되는지, 비슷한 위치의 <b>경쟁</b>이 얼마나 치열한지에 따라 매력도가 달라요."},
{c:5,q:"교수님이 '이게 실은 제일 하고 싶은 얘기'라고 한 내용은?",o:["전략은 저원가와 차별화 중 하나를 고르는 것이다","전략은 저원가와 차별화 사이의 적정한 균형을 결정하는 것이다","차별화가 저원가보다 항상 우월하다","저원가 기업은 차별화를 완전히 버려야 한다"],a:1,e:"두 차원으로 나눈 건 이해를 돕기 위해서였을 뿐, 핵심은 효율화 곡선 위 <b>어디에 위치할지</b>(균형)."},
{c:5,q:"효율화 곡선과 가치혁신에 대한 설명으로 옳지 않은 것은?",o:["곡선 위에 도달한 기업만 경쟁우위가 발생한다","같은 차별화 수준에서 곡선 안쪽에 있는 기업은 덜 효율적이다","효율화 곡선은 고정되어 있어 혁신으로도 바뀌지 않는다","델은 온라인 판매와 조립 주문 제작으로 곡선을 바깥으로 확장했다"],a:2,e:"🪤 곡선은 혁신으로 <b>바깥으로 이동</b>할 수 있어요 = 가치혁신."},
{c:5,q:"시장세분화의 3가지 접근법과 예시를 바르게 짝지은 것이 아닌 것은?",o:["표준화 전략(비차별적) – 코카콜라","세분화 전략(차별적) – 아모레퍼시픽","집중화 전략 – 룰루레몬","표준화 전략 – 세분시장마다 다른 제품 제공"],a:3,e:"🧠 표·세·집. 세분시장마다 다른 제품 = <b>세분화(차별적)</b> 전략."},
{c:5,q:"세분화(차별적) 전략의 높은 원가를 낮추기 위한 노력으로 10/15 수업에서 설명한 것은?",o:["경차·중형차·대형차가 차체·엔진 같은 공통 부품을 모듈화해 공유한다","모든 세분시장에 똑같은 제품을 판다","세분시장 수를 하나로 줄인다","생산을 모두 수작업으로 바꾼다"],a:0,e:"공유 가능한 부품을 늘려 부품 단위에서라도 규모의 경제 = 대량맞춤생산. 생산기술 발전도 원가를 낮춰요."},
{c:5,q:"O/X: 집중화 전략은 시장이 좁아 항상 원가가 낮다.",o:["O","X"],a:1,e:"X. 집중화는 방향이 두 가지예요. 고소득·고부가가치(포르쉐) → 원가↑ / 가성비(기본형 스마트폰) → 원가↓."},
{c:5,q:"좁은 타깃에 차별화했지만 원가율이 업계보다 높고, 가격을 올리지 않고 신뢰를 택한 RAWROW에 대한 교수님의 답은?",o:["고소득·고부가가치 기업","가성비 기업","둘 다 아닌 케이스","표준화 전략 기업"],a:2,e:"'실은 이 케이스는 둘 다 아닌 케이스'(10/15 수업)."},
{c:5,q:"본원적 사업수준 전략에서 교수님이 든 유통업 예시로 옳은 것은?",o:["이마트 – 전반적인 저원가 / 코스트코 – 집중화된 저원가","이마트 – 집중화된 차별화 / 코스트코 – 전반적인 차별화","이마트 – 집중화된 저원가 / 코스트코 – 전반적인 저원가","이마트 – 전반적인 차별화 / 코스트코 – 집중화된 차별화"],a:0,e:"넓은 시장 + 저원가 = 이마트 / 좁은 시장 + 저원가 = 코스트코 / 명품 백화점 = 차별화. 한 산업 안에서 서로 다른 전략이 <b>동등하게 유효</b>해요."},
{c:5,q:"포터의 주장이 아닌 것은?",o:["분명한 선택을 해야 한다","그렇지 않으면 어중간한 상태에 함몰될 수 있다","차별화와 저원가를 동시에 추구하는 것은 불가능하다","가치혁신으로 효율화 곡선을 바깥으로 넓히면 동시 추구가 가능하다"],a:3,e:"④는 포터가 <b>간과한</b> 부분(반론)이에요. 교수님: '포터가 틀렸다는 게 아니다'."},
{c:5,q:"커피 시장에서 저가 브랜드와 프리미엄 브랜드 사이의 애매한 포지션에 있던 브랜드의 성과가 나빠지고 있다. 이를 설명하는 개념은?",o:["가치혁신","어중간한 상태에 함몰(stuck in the middle)","블루오션","대량맞춤생산"],a:1,e:"10/15 수업 예: 컴포즈·메가커피·빽다방 vs 스타벅스 사이에서 이디야."},
{c:5,q:"저원가 기업과 차별화 기업이 경쟁우위를 갖는 이유를 잘못 짝지은 것은?",o:["저원가 – 가격전쟁이 가능하고 약한 경쟁사의 퇴출을 유도한다","차별화 – 가격전쟁으로부터 보호받는다","저원가·차별화 – 둘 다 진입장벽을 형성할 수 있다","차별화 – 가격전쟁으로 약한 경쟁사를 퇴출시킨다"],a:3,e:"🪤 가격전쟁으로 퇴출시키는 건 <b>저원가</b> 쪽이에요."},
{c:5,q:"저원가 기업이 대체재의 위협에서 비교적 자유로운 이유로 10/15 수업에서 설명한 것은?",o:["이미 가격이 저렴하니 소비자가 대체재로 넘어갈 이유가 적다","대체재가 법으로 금지되기 때문","브랜드 충성도가 가장 높기 때문","보완재가 많기 때문"],a:0,e:"차별화 기업은 브랜드 충성도가 대체재로부터 보호해요. 교섭력은 '의존' 관점으로 해석."},
{c:5,q:"사업수준 전략이 실행되기 위해 정렬되어야 하는 세 가지는?",o:["사업수준 전략 – 기능수준 전략 – 조직","미션 – 비전 – 가치","외부환경 – 내부환경 – SWOT","기업전략 – 전술 – 주주가치"],a:0,e:"교수님: '기능수준 전략과 조직이 같이 따라와서 잘 맞물려야 한다, 이 정도만'."},
{c:5,q:"사우스웨스트항공이 설정한 주요 경쟁자는?",o:["다른 대형 항공사","직접 운전하는 사람과 버스 이용자","철도 화물회사","호텔 체인"],a:1,e:"경쟁자를 다시 정의한 것이 블루오션의 출발점. 그래서 도심 공항·잦은 운항·직항이 중요했어요."},
{c:5,q:"사우스웨스트항공의 활동을 ERRC로 잘못 분류한 것은?",o:["기내식·라운지 서비스 – 제거","일일 운항 횟수 – 증가","도심 소형 공항끼리 연결 – 창조","일일 운항 횟수 – 감소"],a:3,e:"편의성을 위해 운항 횟수는 <b>증가</b>시켰어요."},
{c:5,q:"ERRC 4가지 질문의 효과를 잘못 짝지은 것은?",o:["제거 – 원가 절감","감소 – 원가 절감","증가 – 차별화 가치 증가","창조 – 원가 절감"],a:3,e:"🧠 제거·감소 = 원가↓ / 증가·창조 = 가치↑. 둘을 동시에 이루면 가치혁신."},
{c:5,q:"델의 가치혁신을 기존 PC 업체들이 알면서도 쉽게 따라가지 못한 이유로 옳은 것은?",o:["기존 유통업체와의 관계·이미 진행된 투자, 그리고 내부 구성원의 반발","델이 온라인 판매 특허를 독점했기 때문","정부가 온라인 판매를 금지했기 때문","소비자가 오프라인 매장만 원했기 때문"],a:0,e:"성공적인 가치혁신의 이점: 경쟁사가 예상 못한 허점 공략 + <b>추격을 어렵게</b> 만듦."},
{c:5,q:"1장의 '사업전략' 예시(비차집)와 5장 본원적 전략의 연결로 옳은 것은?",o:["비용우위·차별화·집중화는 모두 사업수준 전략에 속한다","집중화는 기업전략에 속한다","차별화는 기능별 전략에 속한다","비용우위는 전술에 속한다"],a:0,e:"🧠 비차집 = 사업전략. 5장에서 저원가·차별화 × 넓음·좁음(집중화)의 4가지로 확장돼요."}
],sa:[
{c:1,q:"비즈니스모델은 여러 전략을 조화롭게 실행해 경쟁우위를 유지하고 높은 수익성을 내게 하는 경영자의 (      )이다.",a:["구상"],e:"정답: 구상"},
{c:1,q:"민츠버그 5P 중 '조직의 비전을 실현하려는 노력'으로, 내부 요인을 바탕으로 위치를 찾는 것은?",a:["관점","perspective"],e:"정답: 관점(Perspective) — '위치'라는 단어 때문에 포지션으로 착각 주의"},
{c:1,q:"여러 대안에 조금씩 나눠 투자한 뒤 반응이 좋은 쪽을 키우는, 책략의 한 예는?",a:["리얼옵션","실물옵션"],e:"정답: 리얼옵션"},
{c:1,q:"'전략'의 어원인 그리스어(군대 + 이끈다)는?",a:["strategos","스트라테고스"],e:"정답: Strategos"},

const CH={1:"1장 · 경영전략이란 무엇인가",2:"2장 · 기업 비전과 사명",3:"3장 · 외부환경 분석",4:"4장 · 내부환경 분석",5:"5장 · 사업수준 전략"};
const NUMS=["①","②","③","④","⑤"];
const KEY="midterm-state-v1";
const blank=s=>({mc:Array(s.mc.length).fill(null),sa:Array(s.sa.length).fill(null),saT:Array(s.sa.length).fill("")});
let cur=0; const state=S.map(blank);
try{const sv=JSON.parse(localStorage.getItem(KEY)||"null");
  if(sv&&Array.isArray(sv.state))sv.state.forEach((x,i)=>{const s=S[i];if(!s||!x||!Array.isArray(x.mc)||x.mc.length!==s.mc.length||!Array.isArray(x.sa)||x.sa.length!==s.sa.length)return;
    state[i]={mc:x.mc,sa:x.sa,saT:Array.isArray(x.saT)&&x.saT.length===s.sa.length?x.saT:Array(s.sa.length).fill("")};});
  if(sv&&Number.isInteger(sv.cur)&&sv.cur>=0&&sv.cur<S.length)cur=sv.cur;}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify({cur,state}));}catch(e){}}
const $=id=>document.getElementById(id);
const norm=t=>t.replace(/[\s()·.,\-]/g,"").toLowerCase();
const esc=t=>String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let wrongView=null; /* {mc:Set, sa:Set} — 틀린 문제만 보기 켰을 때의 목록(다시 풀어도 그대로 보이도록 고정) */
function wrongOf(i){const s=S[i],st=state[i];return{mc:new Set(st.mc.map((v,j)=>v!==null&&v!==s.mc[j].a?j:-1).filter(j=>j>=0)),sa:new Set(st.sa.map((v,j)=>v===false?j:-1).filter(j=>j>=0))};}
function wrongCount(i){const w=wrongOf(i);return w.mc.size+w.sa.size;}

function tabs(){$("tabs").innerHTML=S.map((_,i)=>{const w=wrongCount(i);return `<button role="tab" type="button" aria-selected="${i===cur}" data-i="${i}">${S[i].name||'세트 '+i}${w?` <span class="wc">✕${w}</span>`:""}</button>`;}).join("");
  $("tabs").querySelectorAll("button").forEach(b=>b.onclick=()=>{cur=+b.dataset.i;wrongView=null;save();render();window.scrollTo({top:0});});}
function score(){const st=state[cur],s=S[cur];let p=0,done=0;
  st.mc.forEach((v,i)=>{if(v!==null){done++;if(v===s.mc[i].a)p+=3;}});
  st.sa.forEach(v=>{if(v!==null){done++;if(v)p+=5;}});
  const tot=s.mc.length*3+s.sa.length*5;$("pts").textContent=p;$("tot").textContent=tot;$("prog").textContent=`${done}/${s.mc.length+s.sa.length} 문항`;$("conv").textContent=`30점 환산 ${(p/tot*30).toFixed(1)}`;}
function controls(){const w=wrongCount(cur),on=!!wrongView;
  $("wrongBtn").textContent=on?"전체 문제 보기":`틀린 문제만 보기 (${w})`;$("wrongBtn").setAttribute("aria-pressed",on);
  $("wrongBtn").disabled=!on&&w===0;
  $("retryBtn").hidden=!on||w===0;}
function render(){tabs();const s=S[cur],st=state[cur],wv=wrongView;
  let h=(s.note?`<p class="sub">${s.note}</p>`:"");
  if(wv){const n=wv.mc.size+wv.sa.size;
    h+=`<div class="wbanner">틀린 문제 ${n}개만 보고 있어요. 번호는 원래 번호 그대로예요. 다시 풀어서 맞혀도 이 화면에는 남아 있어요.</div>`;
    if(!n)h+=`<p class="sub">이 세트에서 틀린 문제가 없어요.</p>`;}
  const showMc=s.mc.some((_,i)=>!wv||wv.mc.has(i)),showSa=s.sa.some((_,i)=>!wv||wv.sa.has(i));
  if(showMc)h+=`<h2 class="section">객관식 (각 3점)</h2>`;
  s.mc.forEach((q,i)=>{if(wv&&!wv.mc.has(i))return;const v=st.mc[i];h+=`<div class="q"><span class="chip ch${q.c}">${CH[q.c]}</span><div class="qh"><span class="num">${i+1}.</span><span class="qt">${q.q}</span></div><div class="opts">`+
    q.o.map((o,j)=>{let cls="";if(v!==null){if(j===q.a)cls="right";else if(j===v)cls="wrong";}
      return `<button class="opt ${cls}" type="button" data-q="${i}" data-o="${j}" ${v!==null?"disabled":""}><span class="bub">${q.o.length===2?(j?"X":"O"):j+1}</span><span>${o}</span></button>`;}).join("")+`</div>`+
    (v!==null?`<div class="exp"><strong>${v===q.a?"정답":"오답"} · 정답 ${q.o.length===2?q.o[q.a]:NUMS[q.a]}</strong> — ${q.e}</div>`:"")+`</div>`;});
  if(s.sa.length&&showSa)h+=`<h2 class="section">단답형 (각 5점)</h2>`;
  s.sa.forEach((q,i)=>{if(wv&&!wv.sa.has(i))return;const v=st.sa[i],n=s.mc.length+i+1;h+=`<div class="q"><span class="chip ch${q.c}">${CH[q.c]}</span><div class="qh"><span class="num">${n}.</span><span class="qt">${q.q}</span></div>`+
    `<div class="sa"><input id="sa-${cur}-${i}" aria-label="${n}번 답" placeholder="답을 입력하세요" value="${esc(st.saT[i]||"")}" ${v!==null?"disabled":""}><button type="button" data-sa="${i}" ${v!==null?"disabled":""}>채점</button></div>`+
    (v!==null?`<div class="exp"><span class="${v?"res-ok":"res-no"}">${v?"정답":"오답"}</span> — ${q.e}</div>`:"")+`</div>`;});
  $("main").innerHTML=h;
  $("main").querySelectorAll(".opt").forEach(b=>b.onclick=()=>{st.mc[+b.dataset.q]=+b.dataset.o;save();render();});
  $("main").querySelectorAll("[data-sa]").forEach(b=>b.onclick=()=>{const i=+b.dataset.sa,inp=$(`sa-${cur}-${i}`),t=norm(inp.value);
    if(!t){inp.focus();return;} st.sa[i]=s.sa[i].a.some(x=>t.includes(norm(x)));st.saT[i]=inp.value;save();render();});
  score();controls();}
$("wrongBtn").onclick=()=>{wrongView=wrongView?null:wrongOf(cur);render();window.scrollTo({top:0});};
$("retryBtn").onclick=()=>{const st=state[cur],w=wrongOf(cur);wrongView=w;
  w.mc.forEach(j=>st.mc[j]=null);w.sa.forEach(j=>{st.sa[j]=null;st.saT[j]="";});save();render();window.scrollTo({top:0});};
$("reset").onclick=()=>{state[cur]=blank(S[cur]);wrongView=null;save();render();};
render();
</script>
