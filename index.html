<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>

<style>
/* Layout: 단일 컬럼 시험지, 상단 탭(변형/원본), 문항 카드는 정답 접기 */
:root{
  --bg:#f6f7f5; --paper:#ffffff; --ink:#1d2421; --muted:#5d6a64; --line:#dde3df;
  --accent:#1f6b52; --accent-soft:#e3f0ea; --ans:#7a4a12; --ans-soft:#fbf1e2;
  --display:"Gowun Batang",serif; --body:"IBM Plex Sans KR",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121614; --paper:#1a201d; --ink:#e4ebe7; --muted:#9aa8a1; --line:#2c3531;
  --accent:#6cc4a2; --accent-soft:#1e3029; --ans:#f0c27e; --ans-soft:#2e2517; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121614; --paper:#1a201d; --ink:#e4ebe7; --muted:#9aa8a1; --line:#2c3531;
  --accent:#6cc4a2; --accent-soft:#1e3029; --ans:#f0c27e; --ans-soft:#2e2517; color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.65}
.wrap{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:20px 60px}
header h1{font-family:var(--display);font-size:1.6rem;margin:0 0 4px;text-wrap:balance}
header p{margin:0;color:var(--muted);font-size:.9rem}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding-block:12px;margin-top:12px;border-bottom:1px solid var(--line)}
.tab,.btn{font:inherit;font-size:.9rem;border:1px solid var(--line);background:var(--paper);color:var(--ink);padding:7px 14px;border-radius:999px;cursor:pointer}
.tab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--paper);font-weight:700}
.btn{margin-left:auto}
.tab:focus-visible,.btn:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.note{font-size:.88rem;color:var(--muted);margin:14px 0 4px}
.set{margin-top:22px;padding:12px 14px;background:var(--accent-soft);border-radius:8px;font-size:.93rem}
.q{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:14px 16px;margin-top:12px}
.q .num{font-family:var(--mono);color:var(--accent);font-size:.85rem;margin-right:6px}
.q .stem{margin:0}
.q ol{list-style:none;padding:0;margin:8px 0 0;display:grid;gap:2px}
.tw{overflow-x:auto;margin:10px 0 0}
table{border-collapse:collapse;font-size:.88rem;font-variant-numeric:tabular-nums}
th,td{border:1px solid var(--line);padding:4px 10px;text-align:right;white-space:nowrap}
th{background:var(--accent-soft);font-weight:500;text-align:center}
td:first-child{text-align:left}
details{margin-top:10px}
summary{cursor:pointer;color:var(--accent);font-size:.88rem;font-weight:500;width:max-content}
.ans{margin-top:6px;background:var(--ans-soft);border-radius:6px;padding:8px 12px;font-size:.92rem}
.ans b{color:var(--ans)}
.ans .ref{color:var(--muted);font-size:.82rem}
.ans .exp{font-family:var(--mono);font-size:.84rem;white-space:pre-wrap;margin-top:4px;color:var(--ink)}
</style>

<script>
const T=(h,rows)=>'<div class="tw"><table><tr>'+h.map(x=>'<th>'+x+'</th>').join('')+'</tr>'+rows.map(r=>'<tr>'+r.map(c=>'<td>'+c+'</td>').join('')+'</tr>').join('')+'</table></div>';

/* ---------- 변형 계산문제 ---------- */
const VAR=[
{n:"36",q:"액면가 1,000원, 총발행주식수 25,000주일 때 자본금은 얼마인가? (　)원",a:"25,000,000원",e:"자본금 = 액면가 × 발행주식수 = 1,000 × 25,000"},
{set:"※ 41. 기업공개를 위해 C사와 D증권사가 공모가 산정원칙을 다음과 같이 결정했다.<br>- 본질가치 가중치: 자산가치 1, 수익가치 1.5<br>- 가중평균 EPS 가중치: 2025년 3, 2024년 2, 2023년 1<br>- 자본환원율: 12%"},
{n:"41",q:"주당 본질가치는 얼마인가? (본질가치 = 주당순자산가치 + 주당수익가치의 가중평균)",
 t:T(["항목","2025년","2024년","2023년"],[["순자산총계","60,000,000,000","",""],["기말 발행주식수","4,000,000","4,000,000","4,000,000"],["순이익","16,800,000,000","13,200,000,000","9,600,000,000"]]),
 a:"24,000원",e:"주당자산가치 = 60,000,000,000 / 4,000,000 = 15,000\nEPS: 4,200 / 3,300 / 2,400\n가중평균 EPS = (4,200×3 + 3,300×2 + 2,400×1)/6 = 21,600/6 = 3,600\n주당수익가치 = 3,600 / 0.12 = 30,000\n본질가치 = (15,000×1 + 30,000×1.5)/2.5 = 60,000/2.5 = 24,000"},
{n:"47",q:"액면 200,000원, 전환가격 8,000원인 전환사채의 전환권을 행사하였을 때 받는 주식수는? (　)주",a:"25주",e:"200,000 / 8,000 = 25"},
{n:"48",q:"표면금리 0%, 전환가 4,000원, 액면 100,000원인 CB를 주식시장가격 3,000원일 때 100,000원에 매수하였다. 주식가격이 6,000원으로 상승하였을 때 주식으로 전환하면 얼마의 이득을 얻을 수 있는가? (　)원",a:"50,000원",e:"전환주식수 = 100,000/4,000 = 25주\n전환 후 가치 = 25 × 6,000 = 150,000\n이득 = 150,000 − 100,000 = 50,000"},
{n:"50",q:"행사가 250P, 콜옵션 프리미엄 6.2P, 현재 주가지수 255P일 때 시간가치는 얼마인가? (　)P",a:"1.2P",e:"내재가치 = MAX(0, 255−250) = 5\n프리미엄 6.2 = 5 + TV → TV = 1.2"},
{n:"51",q:"행사가격 340포인트인 코스피200 콜옵션 3계약을 계약당 1.8포인트에 매입(long)했다. 만기일에 코스피200지수가 346포인트이면 콜옵션 매수자의 최종 손익은? (거래승수 250,000원)",o:["2,150,000원","3,150,000원","4,500,000원","−1,350,000원"],a:"② 3,150,000원",e:"1계약당 이익 = MAX(346−340, 0) − 1.8 = 4.2\n4.2 × 250,000 × 3 = 3,150,000"},
{n:"52",q:"행사가격 320포인트인 코스피200 콜옵션 2계약을 계약당 1.5포인트에 매도(short)했다. 만기일에 코스피200지수가 326포인트이면 콜옵션 매도자의 최종 손익은? (거래승수 250,000원)",o:["−2,250,000원","−3,000,000원","750,000원","2,250,000원"],a:"① −2,250,000원",e:"1계약당 이익 = 1.5 − MAX(326−320, 0) = −4.5\n−4.5 × 250,000 × 2 = −2,250,000"},
{n:"53",q:"행사가격 300포인트인 코스피200 풋옵션 4계약을 계약당 1.6포인트에 매입했다. 만기일에 코스피200지수가 303포인트이면 풋옵션 매수자의 최종 손익은? (거래승수 250,000원)",o:["−1,600,000원","−1,000,000원","1,400,000원","3,000,000원"],a:"① −1,600,000원",e:"1계약당 이익 = MAX(300−303, 0) − 1.6 = −1.6 (지수가 올라 행사 포기, 프리미엄만 손실)\n−1.6 × 250,000 × 4 = −1,600,000"},
{n:"54",q:"행사가격 310포인트인 코스피200 풋옵션 3계약을 계약당 2.5포인트에 매도했다. 만기일에 코스피200지수가 308포인트이면 풋옵션 매도자의 최종 손익은? (거래승수 250,000원)",o:["375,000원","−1,125,000원","1,500,000원","1,875,000원"],a:"① 375,000원",e:"1계약당 이익 = 2.5 − MAX(310−308, 0) = 0.5\n0.5 × 250,000 × 3 = 375,000"},
{n:"55",q:"5대 1 주식분할(액면분할)의 경우 300주를 소유한 주주는 분할 후 새로운 주식을 (　)주 소유한 주주가 된다.",a:"1,500주",e:"1주가 5주로 → 300 × 5 = 1,500"},
{set:"※ 56~57. 현재 발행주식수는 200주이며 1주당 시장가격은 2,000원이다. 유상증자를 통해 주당 1,400원에 100주를 발행하는 경우"},
{n:"56",q:"이론 권리락 주가는? (　)원",a:"1,800원",e:"(2,000×200 + 1,400×100)/(200+100) = 540,000/300 = 1,800"},
{n:"57",q:"신주인수권의 가치는? (　)원",a:"200원",e:"권리부 주가 − 이론 권리락 주가 = 2,000 − 1,800 = 200"},
{n:"58",q:"지정가주문 7,000원 400주 사자 주문입력 직후(체결 후) 결과화면에서 (ㄱ), (ㄴ)을 채우시오.",
 t:'<div class="tw"><table><tr><th colspan="3">주문 전</th><th colspan="3">주문 후</th></tr><tr><th>팔자</th><th>가격</th><th>사자</th><th>팔자</th><th>가격</th><th>사자</th></tr><tr><td>400</td><td>9,000</td><td></td><td>400</td><td>9,000</td><td></td></tr><tr><td>250</td><td>8,000</td><td></td><td>250</td><td>8,000</td><td></td></tr><tr><td>150</td><td>7,000</td><td></td><td>(ㄱ)</td><td>7,000</td><td>(ㄴ)</td></tr><tr><td></td><td>6,000</td><td>200</td><td></td><td>6,000</td><td>200</td></tr></table></div>',
 o:["0, 400","150, 250","0, 250","150, 400"],a:"③ 0, 250",e:"7,000원 팔자 150주와 체결 → 팔자 잔량 0\n사자 400 − 150 = 250주가 7,000원 사자에 대기"},
{n:"60",q:"신용거래보증금률이 50%인 경우 현금 80만원을 가진 고객은 주식을 (　)만원까지 매입할 수 있다.",a:"160만원",e:"80 / 0.5 = 160"},
{set:"※ 64~66. 기준시점의 주가지수가 100일 때"+T(["종목","기준 가격","기준 주식수","비교 가격","비교 주식수"],[["A","40","20","60","20"],["B","20","30","30","30"],["C","40","10","50","10"]])},
{n:"64",q:"주당가격 가중방법에 의한 비교시점의 주가지수는?",o:["125.00","140.00","144.44","141.67"],a:"② 140.00",e:"(60+30+50)/(40+20+40) × 100 = 140/100 × 100 = 140"},
{n:"65",q:"시가총액 가중방법에 의한 비교시점의 주가지수는?",o:["140.00","141.67","144.44","150.00"],a:"③ 144.44",e:"(60×20 + 30×30 + 50×10)/(40×20 + 20×30 + 40×10) × 100\n= (1,200+900+500)/(800+600+400) × 100 = 2,600/1,800 × 100 = 144.44"},
{n:"66",q:"동일 가중방법에 의한 비교시점의 주가지수는?",o:["141.67","144.44","140.00","137.50"],a:"① 141.67",e:"(60/40 + 30/20 + 50/40) ÷ 3 × 100\n= (1.5 + 1.5 + 1.25) ÷ 3 × 100 = 141.67"},
{n:"68",q:"다른 조건이 같다면 어느 주식을 사는 것이 유리한가? (P 주식가격, E 주당순이익)<br>A: P 12,000 E 3,000　B: P 15,000 E 5,000<br>C: P 24,000 E 6,000　D: P 35,000 E 7,000",o:["A주식","B주식","C주식","D주식"],a:"② B주식",e:"PER = P/E → A 4, B 3, C 4, D 5\nPER가 가장 낮은 B가 가장 저평가"},
{n:"70",q:"배당수익률이 4%, 주가가 65,000원이라면 배당금은 (　)원이다.",o:["1,625","2,600","6,500","16,250"],a:"② 2,600원",e:"배당금 = 4% × 65,000 = 2,600"},
{set:"※ 78~81. 연도별 연간 생산량과 가격"+T(["재화","기준연도(2023) P","Q","비교연도(2024) P","Q"],[["A","20","5","25","6"],["B","10","15","12","20"],["C","30","4","30","5"]])},
{n:"78",q:"기준연도(2023)의 명목GDP는?",o:["340","370","400","470"],a:"② 370",e:"20×5 + 10×15 + 30×4 = 100+150+120 = 370"},
{n:"79",q:"비교연도(2024)의 명목GDP는?",o:["470","500","540","580"],a:"③ 540",e:"25×6 + 12×20 + 30×5 = 150+240+150 = 540"},
{n:"80",q:"비교연도(2024)의 실질GDP는?",o:["440","470","500","540"],a:"② 470",e:"기준연도 가격 × 비교연도 수량\n20×6 + 10×20 + 30×5 = 120+200+150 = 470"},
{n:"81",q:"2024년의 실질경제성장률은 (　)%이다.",o:["21.28","27.03","45.95","14.89"],a:"② 27.03%",e:"(470 − 370)/370 × 100 = 27.03%\n(기준연도 실질GDP = 명목GDP 370)"},
{n:"82",q:"밀 생산(농민) → 20억 → 밀가루 생산(제분업자) → 32억 → 빵 생산(빵 생산업자) → 45억 → 빵 소비(소비자)<br>밀가루 생산업자는 얼마만큼의 부가가치를 창출하였는가?",o:["12억","13억","20억","32억"],a:"① 12억",e:"밀 20억을 사서 밀가루 32억 생산 → 32 − 20 = 12억"},
{n:"85",q:"비교연도의 소비자물가지수(CPI)는? (기준연도 CPI는 100, 기준연도 거래량을 가중치로 사용)"+T(["재화","기준 P","기준 Q","비교 P","비교 Q"],[["A","10","40","12","45"],["B","20","35","25","30"],["C","8","25","10","25"]]),o:["118.00","123.00","125.00","130.50"],a:"② 123.00",e:"기준연도 CPI = (10/10×40)+(20/20×35)+(8/8×25) = 100\n비교연도 = (12/10×40)+(25/20×35)+(10/8×25)\n= 48 + 43.75 + 31.25 = 123"},
{n:"86",q:"2024년 GDP디플레이터는?"+T(["연도","명목GDP","실질GDP"],[["2023","1,100","1,100"],["2024","1,500","1,250"]]),o:["83.3","112.0","120.0","136.4"],a:"③ 120.0",e:"명목GDP/실질GDP × 100 = 1,500/1,250 × 100 = 120"},
{set:"※ 88~90. Y(균형국민소득) = C + I + G = 0.8(Y − T) + I + G 라고 할 때<br>※ 0.8(Y − T): 가처분소득의 80%를 소비한다고 가정"},
{n:"88",q:"T=50, I=100, G=60이면 균형국민소득은?",o:["400","600","800","1,000"],a:"② 600",e:"Y = 0.8(Y−50) + 100 + 60 = 0.8Y − 40 + 160\n0.2Y = 120 → Y = 600"},
{n:"89",q:"G가 60에서 100으로 증가되었다면 균형국민소득은?",o:["700","800","900","1,000"],a:"② 800",e:"Y = 0.8Y − 40 + 100 + 100\n0.2Y = 160 → Y = 800"},
{n:"90",q:"G 증가에 따른 국민소득변동 결과에서 정부지출의 승수효과는?",o:["2","2.5","4","5"],a:"④ 5",e:"국민소득 증가분 / 정부지출 증가분 = 200/40 = 5\n(공식: 1/(1−0.8) = 5)"},
{set:"※ 93~96. 아래 재무제표로 재무비율을 모두 구해 보세요."+T(["손익계산서",""],[["매출","800"],["매출원가","(500)"],["매출총이익","300"],["판매비와관리비","(150)"],["영업이익","150"],["금융원가(이자비용)","(30)"],["법인세비용차감전순이익","120"],["법인세비용","(30)"],["당기순이익","90"]])+T(["자산","","부채와 자본",""],[["유동자산","200","유동부채","100"],["(그중 재고자산)","(50)","비유동부채","150"],["비유동자산","300","자본","250"],["총자산","500","부채와 자본","500"]])},

{n:"96-4",q:"매출액순이익률은?",o:["11.25%","15%","18.75%","37.5%"],a:"① 11.25%",e:"당기순이익/매출액 × 100 = 90/800 × 100 = 11.25%",r:"p144"},

{n:"17-변형②",q:"간접금융시장에 대한 설명으로 옳은 것은?",o:["자금 수요자가 주식·채권을 발행하여 투자자로부터 직접 자금을 조달한다.","금융중개기관이 예금 등으로 자금을 모아 자금 수요자에게 대출하므로, 자금 공급자는 자금 수요자와 직접 거래하지 않는다.","대표적인 금융기관은 증권회사와 자산운용사이다.","자금 공급자가 자금 수요자의 부도 위험을 직접 부담한다."],a:"②",e:"예: 내가 은행에 예금 → 은행이 그 돈을 기업에 대출. 나는 은행하고만 거래한다.\n①③④는 직접금융시장의 특징",r:"p18~19"},
{n:"23-변형",q:"[①유통시장, ②2차시장, ③secondary market, ④발행시장] 중 나머지 셋과 다른 것은?",a:"④ 발행시장",e:"유통시장 = 2차시장 = secondary market\n발행시장 = 1차시장 = primary market",r:"p31~32"},
{n:"23-변형②",q:"유통시장에 대한 설명으로 틀린 것은?",o:["이미 발행된 유가증권이 투자자 상호간에 매매 거래되는 시장이다.","증권의 시장성과 유통성을 높인다.","유통시장에서 형성된 가격은 신규 발행 증권의 가격을 결정하는 지표 역할을 한다.","기업이 새로운 증권을 발행하여 투자자로부터 자금을 조달하는 시장이다."],a:"④",e:"④는 발행시장(1차시장) 설명\n유통시장 기능: 시장성·유통성 향상, 공정한 가격 형성, 신규발행 가격의 지표, 담보력 향상\n발행시장 = 자본의 증권화 / 유통시장 = 증권의 현금화"},
{n:"30-변형",q:"발행주체가 중개기관(발행기관)을 거치지 않고 직접 유가증권을 발행·모집하며, 발행 사무와 발행위험도 스스로 부담하는 발행방법은?",o:["직접발행","간접발행","총액인수","잔액인수"],a:"① 직접발행",e:"직접발행: 발행주체가 사무 담당 + 발행위험 부담 (주로 규모가 작은 회사)\n간접발행: 인수기관(증권회사) 도움 → 위탁모집, 잔액인수, 총액인수",r:"p39"},
{n:"30-변형②",q:"직접발행에 대한 설명으로 틀린 것은?",o:["발행주체가 유가증권 발행과 관련된 사무를 담당한다.","발행위험을 발행주체가 부담한다.","소화되지 않은 증권은 인수기관이 인수한다.","사모발행은 비교적 절차가 간단한 직접발행 형태로 이루어진다."],a:"③",e:"③은 간접발행 중 잔액인수 설명\n위탁모집: 미소화분 발행자에게 반납\n잔액인수: 미소화분 인수기관이 인수\n총액인수: 인수기관이 전부 매입 후 일반투자자에게 매출",r:"p39"},
{n:"38-변형",q:"은행이 발행하는 정기예금증서로, 만기 전에 다른 사람에게 양도(매매)할 수 있는 단기금융상품은?",o:["CD","RP","DR","CB"],a:"① CD (양도성예금증서)",r:"p15~18"},
{n:"38-변형②",q:"일정 기간 후 정해진 가격으로 다시 사들이는(환매) 조건으로 채권을 매도하는 단기금융상품은?",o:["CD","RP","DR","CB"],a:"② RP (환매조건부채권)",e:"RP는 채권을 담보로 돈을 주고받는 성격의 상품",r:"p15~18"},
{n:"38-변형③",q:"사채권자가 일정 조건에 따라 발행회사의 주식으로 바꿀 수 있는 권리가 붙은 회사채는?",o:["CD","RP","DR","CB"],a:"④ CB (전환사채)",e:"전환권 행사 시 부채 감소, 자본 증가 (원본 46번)\n참고: DR은 예탁기관이 원주를 보관하고 대신 발행하는 주식예탁증서 (원본 38번)",r:"p56, p66"},
{n:"42-변형",q:"증권시장에서 한 해의 마지막 거래일에 그 해의 거래를 마감하는 것을 (　)라 한다.",o:["상폐","납회","상장","증자"],a:"② 납회",e:"납회: 한 해 증권시장 거래를 마치는 것 (반대로 새해 첫 거래 시작은 개장)\n상폐: 상장폐지\n상장: 증권을 유가증권시장 등에서 매매할 수 있게 하는 것\n증자: 주식을 추가 발행해 자본을 늘리는 것",r:"p62"},
{n:"42-변형②",q:"상장된 증권이 매매 대상으로서의 자격을 잃어 거래소에서 더 이상 거래되지 못하게 되는 것을 (　)라 한다.",o:["상폐","납회","상장","증자"],a:"① 상폐 (상장폐지)",e:"상장폐지 후 5년 이내에 다시 상장하는 것은 재상장",r:"p62"},
{set:"※ 44-변형. 유상증자 방식 4가지를 구분하세요. 보기는 모두 ①구주주배정 ②주주우선공모발행 ③제3자배정 ④직접공모 입니다."},
{n:"44-변형①",q:"유상증자 시 기존 주주에게 지분율에 따라 신주인수권을 배정하여 신주를 인수하게 하는 방식은?",o:["구주주배정","주주우선공모발행","제3자배정","직접공모"],a:"① 구주주배정",e:"기존 주주의 지분율이 떨어지지 않도록 기존 주주에게 먼저 주는 방식",r:"p64~65"},
{n:"44-변형②",q:"유상증자 시 기존 주주가 아니라 임원·종업원·우리사주조합·거래처 등 회사와 특정한 관계에 있는 자에게 신주인수권을 부여하는 방식은?",o:["구주주배정","주주우선공모발행","제3자배정","직접공모"],a:"③ 제3자배정",r:"p64~65"},
{n:"44-변형③",q:"발행회사가 증권회사 등 발행기관을 거치지 않고 직접 일반투자자를 대상으로 신주를 모집하는 방식은?",o:["구주주배정","주주우선공모발행","제3자배정","직접공모"],a:"④ 직접공모",e:"주로 규모가 작은 회사에서 이용",r:"p64~65"},
{n:"44-변형④",q:"구주주나 우리사주조합에 먼저 신주인수권을 배정하고, 실권주가 생기면 일반공모를 하며, 그래도 남으면 발행기관이 인수하는 방식은?",o:["구주주배정","주주우선공모발행","제3자배정","직접공모"],a:"② 주주우선공모발행",e:"구주주배정 + 일반공모 + 발행기관 인수를 섞은 방식 (원본 44번)",r:"p64~65"},
{n:"44-변형⑤",q:"구주주에게 신주인수권을 주지 않고 불특정 다수의 일반투자자를 대상으로 신주를 모집하는 방식은?",o:["구주주배정","일반공모","제3자배정","직접공모"],a:"② 일반공모",e:"보기에 '일반공모'가 나올 수도 있으니 같이 기억",r:"p64~65"},
{n:"49-변형",q:"미래의 특정 시점에 특정 상품을 현재 정한 가격으로 사고팔기로 약속하는 계약으로, 거래소에서 표준화된 조건으로 거래되는 것은?",o:["옵션","선물","선도","스왑"],a:"② 선물",e:"선물: 거래소, 표준화, 증거금·일일정산\n선도: 장외에서 당사자끼리 맺는 비표준화 계약\n옵션: 살(콜) 또는 팔(풋) '권리'\n스왑: 현금흐름(금리·통화 등)을 서로 교환",r:"9장 선물투자"},
{n:"49-변형②",q:"거래소가 아닌 장외에서 거래 당사자끼리 미래의 특정 시점에 정해진 가격으로 사고팔기로 맺는 비표준화된 계약은?",o:["옵션","선물","선도","스왑"],a:"③ 선도",r:"9장 선물투자"},
{n:"49-변형③",q:"두 거래 당사자가 일정 기간 동안 미래의 현금흐름(금리, 통화 등)을 서로 교환하기로 하는 계약은?",o:["옵션","선물","선도","스왑"],a:"④ 스왑"},
{n:"49-변형④",q:"기초자산을 정해진 행사가격으로 '팔 수 있는 권리'는?",o:["콜옵션","풋옵션","선물 매수","선물 매도"],a:"② 풋옵션",e:"콜옵션: 살 권리 / 풋옵션: 팔 권리\n선물은 권리가 아니라 반드시 이행해야 하는 의무(계약)",r:"p66"},
{n:"67-변형",q:"주가를 주당순자산(BPS, 주당 자기자본 장부가치)으로 나누어, 주가가 장부상 순자산의 몇 배로 평가받는지 나타내는 지표는?",o:["PER","PBR","PSR","PCR"],a:"② PBR (= P/BPS)",e:"PER = 주가/주당순이익(EPS)\nPBR = 주가/주당순자산(BPS)\nPSR = 주가/주당매출액(SPS)\nPCR = 주가/주당현금흐름(CPS)",r:"p115~116"},
{n:"67-변형②",q:"A기업의 주가는 30,000원, 순자산은 4,000,000,000원, 발행주식수는 200,000주이다. PBR은?",o:["0.67배","1.0배","1.5배","2.0배"],a:"③ 1.5배",e:"BPS = 4,000,000,000 / 200,000 = 20,000원\nPBR = 30,000 / 20,000 = 1.5배",r:"p116"},
{n:"67-변형③",q:"다른 조건이 같다면 PBR이 1보다 낮은 주식에 대한 해석으로 가장 적절한 것은?",o:["주가가 주당순자산보다 높게 거래되어 고평가되어 있다.","주가가 주당순자산보다 낮게 거래되어 저평가되어 있다.","주가가 주당순이익보다 낮다.","배당수익률이 높다."],a:"②",e:"PBR < 1 → 주가 < BPS → 장부가치보다 싸게 거래 (저평가)",r:"p116"},
{n:"87-변형",q:"(　)은 중앙은행(한국은행)이 통화량과 금리를 조절하여 물가 안정과 경제 안정을 도모하는 정책이다.",o:["통화정책","재정정책","산업정책","무역정책"],a:"① 통화정책",e:"통화정책: 한국은행이 돈을 풀었다 조였다 함\n재정정책: 정부가 정부지출(G)과 세제(T)로 수요에 영향 (원본 87번)",r:"p135~136"},
{n:"87-변형②",q:"통화정책의 수단이 아닌 것은?",o:["공개시장조작","재할인율 조정","지급준비율 조정","정부지출 확대"],a:"④",e:"정부지출 확대는 재정정책 수단",r:"p135~136"},
{n:"87-변형③",q:"중앙은행이 공개시장에서 국채를 매입할 때 나타나는 효과로 옳은 것은?",o:["통화량 증가, 금리 하락","통화량 감소, 금리 상승","통화량 증가, 금리 상승","통화량 감소, 금리 하락"],a:"①",e:"채권을 사면 돈이 시중(은행)으로 풀림 → 돈이 많아지면 돈값(금리)이 떨어짐\n채권을 팔면 반대 (원본 26번과 연결)",r:"p35"},
{n:"87-변형④",q:"인플레이션으로 경기가 과열되어 통화 긴축 정책을 실시할 때 일반적으로 예상되는 효과는?",o:["금리 하락, 환율 상승, 물가 상승","금리 상승, 환율 하락, 물가 하락","금리 상승, 환율 상승, 물가 상승","금리 하락, 환율 하락, 물가 하락"],a:"②",e:"돈이 풀리면: 금리↓ 환율↑ 물가↑\n돈을 조이면(긴축): 금리↑ 환율↓ 물가↓",r:"p135~136"}
];

const ORG=[
{n:"1",q:"맨손으로 물고기를 잡던 사람이 저축해 둔 물고기를 소비하면서 낚싯대 1개를 만들었다. 이후 다시 저축을 하여 낚싯대 1개를 추가로 만들어 고기잡이에 사용한다면, 이러한 현상을 무엇이라 부를 수 있나?",o:["자본 생성","자본 축적","자본 소멸","자본 축소"],a:"②",r:"p6"},
{n:"2",q:"(　)는 현재 유보한 소비를 최대한의 미래 소비로 전환하기 위해 미래에 소득을 창출해 내는 자산(assets)을 취득하고 운용하는 적극적 행위이다. 즉, 확실한 현재의 소비를 희생하여 이에 대한 보상으로 불확실한 미래의 수익을 바라는 행위라고 할 수 있다.",a:"투자",r:"p2"},
{n:"3",q:"투자의 시간 특성은 소비의 경제적 희생이 이루어지는 투자시점은 (　)이지만 그에 대한 보상은 (　)에 이루어진다는 것이다.",a:"현재, 미래",r:"p3"},
{n:"4",q:"투자의 위험 특성은 현재의 희생은 (　)한 것인데 반하여 미래의 수익은 (　)하다는 것이다.",a:"확실, 불확실",r:"p3"},
{n:"5",q:"위험과 미래의 수익은 (　)으로 표현할 수 있다.",o:["high risk-high return, high risk-low return","high risk-high return, low risk-low return","high risk-high return, low risk-high return","high risk-low return, low risk-low return"],a:"②",r:"p5"},
{n:"6",q:"지배원리란?",a:"투자자들은 미래수익이 동일하면 위험이 낮은 투자대상을 선택하고, 위험이 동일하면 미래수익이 높은 대상을 선택한다는 것",r:"p6"},

{set:"※ 41. 기업공개를 위해 A사와 B증권사는 공모가산정원칙을 협의하여 다음과 같이 결정하였다.<br>- 본질가치 가중치: 자산가치 1, 수익가치 1.5<br>- 가중평균 EPS 가중치: 2025년 3, 2024년 2, 2023년 1<br>- 총 공모주식수: 1,000,000주<br>- 자본환원율: 10%"},
{n:"41",q:"주당 본질가치는 얼마인가? (본질가치 = 주당순자산가치 + 주당수익가치)"+T(["항목","2025년","2024년","2023년"],[["순자산총계","100,000,000,000","",""],["기말 발행주식수","5,000,000","5,000,000","5,000,000"],["순이익","20,000,000,000","14,000,000,000","11,000,000,000"]]),a:"27,800원",e:"주당자산가치 = 100,000,000,000/5,000,000 = 20,000\nEPS: 4,000 / 2,800 / 2,200\n가중평균 EPS = (4,000×3 + 2,800×2 + 2,200×1)/6 = 19,800/6 = 3,300\n주당수익가치 = 3,300/0.1 = 33,000\n본질가치 = (20,000 + 33,000×1.5)/2.5 = 69,500/2.5 = 27,800",r:"p61"},

{n:"44",q:"유상증자시 구주주나 우리사주조합에게 신주인수권을 배정하고, 만약 실권주(미청약분)가 발생하면 일반투자자에게 일반공모를 하고 그래도 미청약분이 발생하면 유상증자를 담당하는 발행기관이 나머지를 인수하는 방식은?",o:["구주주배정","주주우선공모발행","제3자배정","직접공모"],a:"②",r:"p64~65"},

{n:"48",q:"표면금리 0%, 전환가 2,000원 액면 100,000원인 CB를 주식시장가격 1,500원일 때 100,000원에 매수하였다. 주식가격이 2,500원으로 상승하였을 때 주식으로 전환하면 얼마의 이득을 얻을 수 있는가? (　)원",a:"25,000원",e:"전환 시 받는 주식수 100,000/2,000 = 50주\n50주 × 2,500 = 125,000\n125,000 − 100,000 = 25,000",r:"p66"},
{n:"49",q:"주식을 정해진 행사가격으로 매입(또는 매도) 할 수 있는 권한(권리)은?",o:["옵션","선물","선도","스왑"],a:"① (살 권리: 콜옵션, 팔 권리: 풋옵션)",r:"p66"},
{n:"50",q:"행사가 80P, 콜옵션 프리미엄 3.5P, 현재 주가지수 83P일 때 시간가치는 얼마인가? (　)P",a:"0.5P",e:"옵션가격(OP) = C(80) = 3.5 = 내재가치(IV) + 시간가치(TV)\n= MAX(0, 83−80) + TV = 3 + TV → TV = 0.5",r:"p66"},
{n:"51",q:"행사가격 344포인트인 코스피200 콜옵션 2계약을 계약당 1.3포인트에 매입(long)했다. 만기일에 코스피200지수가 350포인트이면 콜옵션 매수자의 최종 손익은? (거래승수 250,000원: 1포인트당 거래단위)",o:["1,350,000원","1,850,000원","2,350,000원","2,850,000원"],a:"③",e:"MAX(350−344, 0) − 1.3 = 4.7\n4.7 × 250,000 × 2 = 2,350,000",r:"p66"},
{n:"52",q:"행사가격 331포인트인 코스피200 콜옵션 3계약을 계약당 1.2포인트에 매도(short)했다. 만기일에 코스피200지수가 338포인트이면 콜옵션 매도자의 최종 손익은? (거래승수 250,000원)",o:["−3,850,000원","−4,350,000원","3,850,000원","4,350,000원"],a:"②",e:"−MAX(338−331, 0) + 1.2 = −5.8\n−5.8 × 250,000 × 3 = −4,350,000\n(콜옵션 매도자는 행사가격보다 지수가 오르면 매수자의 행사에 응해야 한다)",r:"p66"},
{n:"53",q:"행사가격 332포인트인 코스피200 풋옵션 2계약을 계약당 1.4포인트에 매입했다. 만기일에 코스피200지수가 337포인트이면 풋옵션 매수자의 최종 손익은? (거래승수 250,000원)",o:["−700,000원","−500,000원","250,000원","700,000원"],a:"①",e:"MAX(332−337, 0) − 1.4 = −1.4\n−1.4 × 250,000 × 2 = −700,000\n(풋옵션을 매입했으나 지수가 상승해 행사 포기 → 프리미엄만 부담)",r:"p66"},
{n:"54",q:"행사가격 333포인트인 코스피200 풋옵션 5계약을 계약당 2.2포인트에 매도했다. 만기일에 코스피200지수가 332포인트이면 풋옵션 매도자의 최종 손익은? (거래승수 250,000원)",o:["−700,000원","−500,000원","1,000,000원","1,500,000원"],a:"④",e:"2.2 − MAX(333−332, 0) = 1.2\n1.2 × 250,000 × 5 = 1,500,000\n(지수가 하락해 풋옵션이 행사되었지만 그 폭이 작아 프리미엄 수취분을 감안하면 최종적으로 이익)",r:"p66"},

const CIRC=["①","②","③","④"];
const esc=s=>s;
function render(list,el,prefix){
  el.innerHTML=(prefix||'')+list.map(x=>{
    if(x.set) return '<div class="set">'+x.set+'</div>';
    const opts=x.o?'<ol>'+x.o.map((o,i)=>'<li>'+CIRC[i]+' '+o+'</li>').join('')+'</ol>':'';
    const exp=x.e?'<div class="exp">'+x.e+'</div>':'';
    const ref=x.r?' <span class="ref">· 교재 '+x.r+'</span>':'';
    return '<article class="q"><p class="stem"><span class="num">'+x.n+'.</span>'+x.q+'</p>'+(x.t||'')+opts+
      '<details><summary>정답 보기</summary><div class="ans"><b>정답: '+x.a+'</b>'+ref+exp+'</div></details></article>';
  }).join('');
}

render(CON,document.getElementById('pane-con'),'<p class="note">원본 개념문제의 정답·오답 보기를 바꿔 다시 냈습니다. 같은 범위에서 다른 걸 물어봐도 맞힐 수 있게 대비하는 용도입니다.</p>');
render(EXT,document.getElementById('pane-ext'),'<p class="note">퀴즈답안지 96제에 없는 시험범위 나머지(강의 녹음·교재)에서 원본과 같은 스타일로 만든 예상문제입니다. 계산문제는 EVA 위주입니다. 교재 쪽수는 강의에서 언급된 쪽 기준이에요.</p>');
render(ORG,document.getElementById('pane-org'),'<p class="note">퀴즈답안지 1~96번을 그대로 옮겼습니다.</p>');

const tabs=[...document.querySelectorAll('.tab')];
let cur=document.getElementById('pane-var');
function sel(t){tabs.forEach(b=>{const on=b===t;b.setAttribute('aria-selected',on);document.getElementById(b.dataset.pane).hidden=!on;});cur=document.getElementById(t.dataset.pane);window.scrollTo(0,0);syncBtn();}
tabs.forEach(b=>b.onclick=()=>sel(b));
const btn=document.getElementById('toggleAll');
function pane(){return cur}
function syncBtn(){const d=[...pane().querySelectorAll('details')];btn.textContent=d.length&&d.every(x=>x.open)?'정답 모두 접기':'정답 모두 펼치기';}
btn.onclick=()=>{const d=[...pane().querySelectorAll('details')];const open=!d.every(x=>x.open);d.forEach(x=>x.open=open);syncBtn();};
document.addEventListener('toggle',syncBtn,true);
</script>
